
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stickman Battle</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  display: block;
  width: 100vw;
  height: 100dvh;
  background: #8bd5ff;
}

#menu {
  position: fixed;
  inset: 0;
  background: linear-gradient(#111827, #263b5c);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 10;
  padding: 20px;
}

#menu h1 {
  font-size: clamp(34px, 8vw, 60px);
  color: #ffd43b;
  text-shadow: 4px 4px #000;
}

#menu p {
  color: #cbd5e1;
  text-align: center;
}

.menuButton {
  width: min(330px, 90%);
  min-height: 58px;
  border: 0;
  border-radius: 12px;
  background: #f5b82e;
  color: #111827;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.menuButton:active {
  transform: scale(.96);
}

#status {
  font-size: 13px;
  color: #93c5fd;
  text-align: center;
}

#roomInput {
  width: min(330px, 90%);
  padding: 15px;
  border-radius: 10px;
  border: 0;
  font-size: 18px;
  text-align: center;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: none;
  justify-content: space-between;
  pointer-events: none;
  font-weight: bold;
  text-shadow: 2px 2px 3px black;
  font-size: 15px;
}

#controls {
  position: fixed;
  bottom: max(18px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  display: none;
  justify-content: space-between;
  padding: 0 22px;
  align-items: end;
  pointer-events: none;
}

.controlGroup {
  display: flex;
  gap: 13px;
  align-items: end;
  pointer-events: auto;
}

.ctrl {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid #ffffffaa;
  background: #172033cc;
  color: white;
  font-size: 28px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
}

.ctrl:active, .ctrl.active {
  background: #e9a817;
  color: #111;
  transform: scale(.94);
}

#shoot {
  width: 88px;
  height: 88px;
  background: #d93434dd;
  font-size: 20px;
}

#jump {
  background: #2563ebdd;
}

#backButton {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 5;
  display: none;
  padding: 12px 18px;
  background: #172033dd;
  color: white;
  border: 1px solid white;
  border-radius: 9px;
  font-weight: bold;
}

@media (max-height: 430px) {
  .ctrl {
    width: 62px;
    height: 62px;
    font-size: 23px;
  }
  #shoot {
    width: 70px;
    height: 70px;
  }
  #controls {
    bottom: 8px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
  <h1>STICKMAN BATTLE</h1>
  <p>Entre na batalha!</p>
  <button class="menuButton" onclick="startSolo()">JOGAR SOZINHO</button>
  <button class="menuButton" onclick="createRoom()">CRIAR SALA ONLINE</button>
  <input id="roomInput" maxlength="6" placeholder="CÓDIGO DA SALA">
  <button class="menuButton" onclick="enterRoom()">ENTRAR NA SALA</button>
  <div id="status">Conectando ao Firebase...</div>
</div>

<div id="hud">
  <span id="health">VIDA: 100</span>
  <span id="weapon">ARMA: Nenhuma</span>
  <span id="roomLabel"></span>
</div>

<button id="backButton" onclick="backToMenu()">SAIR</button>

<div id="controls">
  <div class="controlGroup">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="controlGroup">
    <button class="ctrl" id="jump">↑</button>
    <button class="ctrl" id="shoot">ATIRAR</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// CONFIGURAÇÃO DO FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
  authDomain: "draw-battle-60d94.firebaseapp.com",
  databaseURL: "https://draw-battle-60d94-default-rtdb.firebaseio.com",
  projectId: "draw-battle-60d94",
  storageBucket: "draw-battle-60d94.firebasestorage.app",
  messagingSenderId: "533481028234",
  appId: "1:533481028234:web:d2fb69123057bcdd3e4b73",
  measurementId: "G-4ZZY2234EY"
};

let db = null;
let uid = null;
let roomRef = null;
let online = false;
let roomCode = "";

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();

  firebase.auth().signInAnonymously()
    .then(result => {
      uid = result.user.uid;
      document.getElementById("status").textContent =
        "Firebase conectado!";
    })
    .catch(error => {
      document.getElementById("status").textContent =
        "Erro Firebase: " + error.message;
    });
} catch(error) {
  document.getElementById("status").textContent =
    "Erro ao iniciar Firebase: " + error.message;
}

// ELEMENTOS
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H, scale;
let running = false;
let camera = 0;
let lastTime = 0;
let dropTimer = 0;
let players = {};
let bullets = [];
let weapons = [];
let platforms = [];
let keys = {};
let remotePlayers = {};

const world = {
  width: 5000,
  floor: 650
};

const weaponTypes = [
  {name:"Pistola", damage:12, speed:13, rate:350, color:"#facc15"},
  {name:"Rifle", damage:9, speed:16, rate:130, color:"#e5e7eb"},
  {name:"Shotgun", damage:8, speed:12, rate:700, spread:5, color:"#fb923c"},
  {name:"Sniper", damage:55, speed:25, rate:1100, color:"#a78bfa"},
  {name:"Metralhadora", damage:7, speed:17, rate:80, color:"#38bdf8"},
  {name:"Laser", damage:20, speed:28, rate:500, color:"#f472b6"},
  {name:"Canhão", damage:45, speed:10, rate:1000, color:"#f97316"},
  {name:"Arco", damage:24, speed:15, rate:650, color:"#a16207"},
  {name:"Plasma", damage:18, speed:14, rate:240, color:"#22d3ee"},
  {name:"Bazuca", damage:60, speed:9, rate:1300, color:"#ef4444"},
  {name:"Pistola Dupla", damage:10, speed:14, rate:250, color:"#fde047"},
  {name:"Rifle Pesado", damage:18, speed:17, rate:300, color:"#94a3b8"},
  {name:"Rajada", damage:11, speed:16, rate:170, color:"#4ade80"},
  {name:"Railgun", damage:70, speed:32, rate:1500, color:"#c084fc"},
  {name:"Lança-chamas", damage:5, speed:8, rate:60, color:"#fb923c"},
  {name:"Besta", damage:30, speed:18, rate:800, color:"#a3e635"},
  {name:"Revolver", damage:20, speed:15, rate:500, color:"#d6d3d1"},
  {name:"Mini Gun", damage:6, speed:18, rate:55, color:"#60a5fa"},
  {name:"Granada", damage:40, speed:8, rate:900, color:"#86efac"},
  {name:"Arma de Energia", damage:35, speed:22, rate:600, color:"#e879f9"}
];

const player = {
  x: 300,
  y: 300,
  vx: 0,
  vy: 0,
  w: 32,
  h: 65,
  health: 100,
  speed: 5,
  jumpPower: 14,
  grounded: false,
  facing: 1,
  weapon: null,
  lastShot: 0,
  color: "#202020"
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  scale = dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// MAPA E PLATAFORMAS
function createMap() {
  platforms = [
    {x:0,y:650,w:5000,h:100},
    {x:250,y:520,w:230,h:22},
    {x:600,y:440,w:250,h:22},
    {x:950,y:550,w:280,h:22},
    {x:1350,y:470,w:220,h:22},
    {x:1700,y:390,w:260,h:22},
    {x:2100,y:510,w:300,h:22},
    {x:2500,y:430,w:240,h:22},
    {x:2900,y:540,w:280,h:22},
    {x:3300,y:460,w:250,h:22},
    {x:3700,y:370,w:280,h:22},
    {x:4100,y:500,w:300,h:22},
    {x:4500,y:420,w:250,h:22},
    {x:750,y:300,w:180,h:20},
    {x:1800,y:260,w:200,h:20},
    {x:2700,y:270,w:200,h:20},
    {x:3600,y:250,w:200,h:20},
    {x:4400,y:280,w:200,h:20}
  ];
}
createMap();

function startSolo() {
  online = false;
  roomCode = "";
  beginGame();
}

function createRoom() {
  if (!db || !uid) {
    alert("Aguarde a conexão com o Firebase. Verifique se o login anônimo está ativado.");
    return;
  }

  roomCode = Math.random().toString(36).substring(2,8).toUpperCase();
  roomRef = db.ref("rooms/" + roomCode);

  roomRef.set({
    created: Date.now(),
    players: {}
  }).then(() => {
    online = true;
    document.getElementById("roomLabel").textContent = "Sala: " + roomCode;
    beginGame();
    connectRoom();
    alert("Sala criada! Código: " + roomCode);
  }).catch(error => {
    alert("Erro ao criar sala: " + error.message);
  });
}

function enterRoom() {
  if (!db || !uid) {
    alert("Aguarde a conexão com o Firebase.");
    return;
  }

  const code = document.getElementById("roomInput").value.trim().toUpperCase();

  if (!code) {
    alert("Digite o código da sala.");
    return;
  }

  roomCode = code;
  roomRef = db.ref("rooms/" + roomCode);

  roomRef.get().then(snapshot => {
    if (!snapshot.exists()) {
      alert("Sala não encontrada.");
      return;
    }

    online = true;
    document.getElementById("roomLabel").textContent = "Sala: " + roomCode;
    beginGame();
    connectRoom();
  }).catch(error => {
    alert("Erro ao entrar: " + error.message);
  });
}

function connectRoom() {
  roomRef.child("players/" + uid).onDisconnect().remove();

  roomRef.child("players").on("value", snapshot => {
    remotePlayers = snapshot.val() || {};
    delete remotePlayers[uid];
  });
}

function syncPlayer() {
  if (!online || !roomRef || !uid) return;

  roomRef.child("players/" + uid).set({
    x: player.x,
    y: player.y,
    health: player.health,
    facing: player.facing,
    color: player.color,
    weapon: player.weapon ? player.weapon.name : null
  });
}

// INICIAR JOGO
function beginGame() {
  player.x = 300;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
  player.health = 100;
  player.weapon = null;
  bullets = [];
  weapons = [];
  camera = 0;
  dropTimer = 0;
  running = true;

  document.getElementById("menu").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("controls").style.display = "flex";
  document.getElementById("backButton").style.display = "block";

  requestAnimationFrame(loop);
}

function backToMenu() {
  running = false;

  if (online && roomRef && uid) {
    roomRef.child("players/" + uid).remove();
    roomRef.child("players").off();
  }

  online = false;
  roomRef = null;
  remotePlayers = {};

  document.getElementById("menu").style.display = "flex";
  document.getElementById("hud").style.display = "none";
  document.getElementById("controls").style.display = "none";
  document.getElementById("backButton").style.display = "none";
}

// CONTROLES DE TECLADO
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === " " || e.key.startsWith("Arrow")) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// CONTROLES MOBILE
function bindButton(id, key) {
  const button = document.getElementById(id);

  const down = e => {
    e.preventDefault();
    keys[key] = true;
    button.classList.add("active");
  };

  const up = e => {
    e.preventDefault();
    keys[key] = false;
    button.classList.remove("active");
  };

  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointercancel", up);
  button.addEventListener("pointerleave", up);
}

bindButton("left", "a");
bindButton("right", "d");
bindButton("jump", "w");
bindButton("shoot", "shoot");

// ARMAS
function spawnWeaponWave() {
  for (let i = 0; i < 2; i++) {
    const type = weaponTypes[Math.floor(Math.random() * weaponTypes.length)];

    weapons.push({
      x: 200 + Math.random() * (world.width - 400),
      y: 100 + Math.random() * 300,
      type
    });
  }
}

function pickWeapon() {
  for (let i = weapons.length - 1; i >= 0; i--) {
    const w = weapons[i];

    if (
      Math.abs(player.x - w.x) < 40 &&
      Math.abs(player.y - w.y) < 70
    ) {
      player.weapon = w.type;
      weapons.splice(i, 1);
    }
  }
}

function shoot() {
  if (!player.weapon) return;

  const now = Date.now();
  if (now - player.lastShot < player.weapon.rate) return;

  player.lastShot = now;

  const spread = player.weapon.spread || 1;

  for (let i = 0; i < spread; i++) {
    const angle = spread > 1
      ? (i - (spread - 1) / 2) * 0.12
      : 0;

    const direction = player.facing;

    bullets.push({
      x: player.x + player.w / 2 + direction * 20,
      y: player.y + 25,
      vx: Math.cos(angle) * player.weapon.speed * direction,
      vy: Math.sin(angle) * player.weapon.speed,
      damage: player.weapon.damage,
      color: player.weapon.color
    });
  }
}

// FÍSICA
function update(dt) {
  const step = Math.min(dt / 16.67, 2);

  if (keys.a || keys.arrowleft) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (keys.d || keys.arrowright) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx *= 0.75;
  }

  if ((keys.w || keys.arrowup || keys[" "]) && player.grounded) {
    player.vy = -player.jumpPower;
    player.grounded = false;
  }

  if (keys.shoot || keys.j) shoot();

  player.x += player.vx * step;
  player.x = Math.max(0, Math.min(world.width - player.w, player.x));

  player.vy += 0.65 * step;
  player.y += player.vy * step;
  player.grounded = false;

  for (const p of platforms) {
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h <= p.y + p.h + 20 &&
      player.vy >= 0
    ) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  if (player.y > 900) {
    player.health = 0;
  }

  pickWeapon();

  dropTimer += dt / 1000;
  if (dropTimer >= 40) {
    spawnWeaponWave();
    dropTimer = 0;
  }

  updateBullets(step);

  camera = player.x - W / 2;
  camera = Math.max(0, Math.min(world.width - W, camera));

  document.getElementById("health").textContent =
    "VIDA: " + Math.max(0, Math.floor(player.health));

  document.getElementById("weapon").textContent =
    "ARMA: " + (player.weapon ? player.weapon.name : "Nenhuma");

  syncPlayer();

  if (player.health <= 0) {
    running = false;
    setTimeout(() => {
      alert("Você foi derrotado! Tente novamente.");
      backToMenu();
    }, 100);
  }
}

function updateBullets(step) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx * step;
    b.y += b.vy * step;

    if (
      b.x < 0 || b.x > world.width ||
      b.y < 0 || b.y > 900
    ) {
      bullets.splice(i, 1);
      continue;
    }

    for (const id in remotePlayers) {
      const target = remotePlayers[id];

      if (
        Math.abs(b.x - target.x - 16) < 22 &&
        Math.abs(b.y - target.y - 30) < 40
      ) {
        if (online && roomRef) {
          roomRef.child("players/" + id + "/health")
            .set(Math.max(0, (target.health || 100) - b.damage));
        }

        bullets.splice(i, 1);
        break;
      }
    }
  }
}

// DESENHO
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#64c5ff");
  sky.addColorStop(1, "#d7f2ff");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ffffff88";

  for (let i = 0; i < 8; i++) {
    const x = ((i * 240 - camera * 0.3) % (W + 300) + W + 300) % (W + 300);
    ctx.beginPath();
    ctx.arc(x, 120 + (i % 3) * 45, 35, 0, Math.PI * 2);
    ctx.arc(x + 35, 110 + (i % 3) * 45, 42, 0, Math.PI * 2);
    ctx.arc(x + 75, 125 + (i % 3) * 45, 30, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMap() {
  for (const p of platforms) {
    const x = p.x - camera;

    if (x + p.w < 0 || x > W) continue;

    ctx.fillStyle = "#287b39";
    ctx.fillRect(x, p.y, p.w, p.h);

    ctx.fillStyle = "#6b4423";
    ctx.fillRect(x, p.y + 8, p.w, p.h - 8);
  }
}

function drawStickman(x, y, color, facing) {
  ctx.save();
  ctx.translate(x - camera, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  // Cabeça
  ctx.beginPath();
  ctx.arc(16, 9, 9, 0, Math.PI * 2);
  ctx.stroke();

  // Corpo
  ctx.beginPath();
  ctx.moveTo(16, 18);
  ctx.lineTo(16, 43);
  ctx.stroke();

  // Braços
  ctx.beginPath();
  ctx.moveTo(16, 25);
  ctx.lineTo(3, 36);
  ctx.moveTo(16, 25);
  ctx.lineTo(29, 33);
  ctx.stroke();

  // Pernas
  ctx.beginPath();
  ctx.moveTo(16, 43);
  ctx.lineTo(5, 62);
  ctx.moveTo(16, 43);
  ctx.lineTo(27, 62);
  ctx.stroke();

  // Arma
  if (color === player.color && player.weapon) {
    ctx.fillStyle = player.weapon.color;
    ctx.fillRect(facing === 1 ? 25 : -12, 30, 20, 5);
  }

  ctx.restore();
}

function drawWeapons() {
  for (const w of weapons) {
    const x = w.x - camera;

    if (x < -50 || x > W + 50) continue;

    ctx.fillStyle = w.type.color;
    ctx.fillRect(x, w.y, 26, 10);

    ctx.fillStyle = "#111";
    ctx.font = "11px Arial";
    ctx.fillText(w.type.name, x - 15, w.y - 7);
  }
}

function drawBullets() {
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x - camera, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRemotePlayers() {
  for (const id in remotePlayers) {
    const p = remotePlayers[id];
    drawStickman(p.x, p.y, p.color || "#d22", p.facing || 1);

    ctx.fillStyle = "#111";
    ctx.font = "12px Arial";
    ctx.fillText("JOGADOR", p.x - camera - 10, p.y - 12);
  }
}

function draw() {
  drawBackground();
  drawMap();
  drawWeapons();
  drawBullets();
  drawRemotePlayers();
  drawStickman(player.x, player.y, player.color, player.facing);
}

// LOOP
function loop(time) {
  if (!running) return;

  const dt = Math.min(time - (lastTime || time), 50);
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}
</script>
</body>
</html>

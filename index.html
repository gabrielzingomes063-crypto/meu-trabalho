
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121722;color:#fff;font-family:Arial;touch-action:none}
canvas{display:block;width:100%;height:100%}
#lobby{position:fixed;inset:0;display:grid;place-items:center;background:#111827;z-index:5;padding:18px}
.panel{background:#242e40;padding:24px;border-radius:18px;width:min(420px,100%);box-shadow:0 15px 55px #0009}
input,button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:9px;font-size:15px}
button{background:#d94e37;color:white;font-weight:bold}
button.alt{background:#46536a}
#status{font-size:13px;color:#ffd18a;margin-top:10px;min-height:18px}
#hud{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:2;background:#101a;padding:9px 14px;border-radius:10px;text-align:center;font-size:12px}
.bars{display:flex;gap:8px;align-items:center}
.bar{width:95px;height:9px;background:#633;border-radius:9px;overflow:hidden}
.fill{height:100%;background:#59d17b;width:100%}
#controls{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
#stick{position:absolute;left:22px;bottom:22px;width:145px;height:145px;border:2px solid #ffffff70;background:#ffffff20;border-radius:50%;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:#e9edf0dd;border:2px solid white}
.ctrl{position:absolute;display:grid;place-items:center;border-radius:50%;border:2px solid #ffffffaa;color:white;font-weight:bold;background:#ffffff30;pointer-events:auto;user-select:none}
#jump{right:24px;bottom:26px;width:76px;height:76px;font-size:30px;background:#287bc9bb}
#fire{right:115px;bottom:30px;width:82px;height:82px;background:#c83c32cc}
#special{right:32px;bottom:120px;width:64px;height:64px;background:#8149b5cc;font-size:12px}
#weaponBox{position:fixed;top:65px;left:50%;transform:translateX(-50%);display:none;z-index:2;gap:5px;flex-wrap:wrap;justify-content:center;width:min(95%,650px);pointer-events:auto}
.weapon{width:auto;margin:0;padding:7px 9px;font-size:11px;background:#303e55;border:1px solid #8996aa}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#ddd;z-index:2;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="lobby">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <p>Combate online • 20 armas • física 2D</p>
  <button id="create">CRIAR SALA</button>
  <input id="room" maxlength="6" inputmode="numeric" placeholder="Código de 6 números">
  <button id="join" class="alt">ENTRAR NA SALA</button>
  <div id="status">Conectando ao Firebase...</div>
 </div>
</div>

<div id="hud">
 <div class="bars">
  <span>VOCÊ</span><div class="bar"><div id="myhp" class="fill"></div></div>
  <span>RIVAL</span><div class="bar"><div id="ehp" class="fill"></div></div>
 </div>
 <div id="roomname"></div>
</div>

<div id="weaponBox"></div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="fire" class="ctrl">ATIRAR</div>
 <div id="jump" class="ctrl">↑</div>
 <div id="special" class="ctrl">ESPECIAL</div>
</div>
<div id="hint">Joystick: mover • ↑ pular • ATIRAR • ESPECIAL</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);

let uid=null,roomRef=null,playerRef=null,playing=false;
let enemyData=null,lastNet=0,lastShotNet=0;

const status=t=>$("status").textContent=t;

auth.signInAnonymously()
.then(c=>{
 uid=c.user.uid;
 status("Conectado. Crie ou entre em uma sala.");
})
.catch(e=>status("Firebase: "+e.message));

const WEAPONS=[
["Pistola","pistol",15,1050,.32,1,80,"#ffd36b"],
["Revólver","revolver",29,1250,.58,1,150,"#ffcb72"],
["Desert Eagle","deagle",38,1350,.72,1,210,"#ffd36b"],
["Escopeta","shotgun",9,850,.85,8,300,"#ff9955"],
["Escopeta dupla","double",11,900,1.05,12,380,"#ff9955"],
["SMG","smg",7,1150,.09,1,70,"#ffe08a"],
["MP5","mp5",8,1200,.12,1,85,"#ffe08a"],
["Vector","vector",6,1250,.07,1,65,"#ffe08a"],
["Rifle","rifle",11,1450,.16,1,125,"#ffdf79"],
["AK","ak",13,1400,.19,1,165,"#ffdf79"],
["M4","m4",10,1550,.13,1,120,"#ffdf79"],
["Fuzil pesado","heavy",19,1300,.32,1,230,"#ffad63"],
["Sniper","sniper",65,1900,1.25,1,430,"#c8edff"],
["DMR","dmr",27,1650,.48,1,260,"#c8edff"],
["Lança-chamas","flame",4,520,.055,1,110,"#ff733c"],
["Lançador","rocket",48,650,1.4,1,600,"#ff8050"],
["Granada","grenade",55,500,1.2,1,450,"#8dff91"],
["Laser","laser",32,1750,.55,1,220,"#55eaff"],
["Plasma","plasma",25,900,.38,1,200,"#bc79ff"],
["Canhão","cannon",85,1000,1.8,1,850,"#ff5c9c"]
].map(a=>({
 name:a[0],id:a[1],damage:a[2],speed:a[3],
 rate:a[4],pellets:a[5],kick:a[6],color:a[7]
}));

const WORLD={w:7200,floor:760};

const player={
 x:450,y:500,vx:0,vy:0,hp:100,
 face:1,ground:false,weapon:0,cool:0,stun:0,aim:0
};

let rival={
 x:6500,y:500,vx:0,vy:0,hp:100,face:-1,weapon:0
};

let cameraX=0,cameraY=0;
let W=innerWidth,H=innerHeight,D=1;

const canvas=$("game"),ctx=canvas.getContext("2d");

function resize(){
 W=innerWidth;H=innerHeight;
 D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
resize();

const platforms=[
 [0,760,7200,250],
 [400,630,370,25],
 [1050,540,350,25],
 [1640,650,440,25],
 [2300,560,390,25],
 [2950,650,500,25],
 [3650,535,420,25],
 [4350,630,500,25],
 [5100,540,440,25],
 [5800,640,500,25],
 [6500,550,400,25],
 [800,400,230,22],
 [2500,370,300,22],
 [4550,390,280,22],
 [6200,400,260,22]
];

const props=[];
for(let x=260;x<7000;x+=430){
 props.push({
  x,y:695,w:62,h:65,
  type:x%3?"crate":"barrel"
 });
}

let bullets=[],effects=[],drops=[],grenades=[];
let dropClock=0;
let last=performance.now();

const input={
 axis:0,jump:false,fire:false,special:false
};

function makeButtons(id,key){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  input[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  el.addEventListener(ev,()=>input[key]=false)
 );
}

makeButtons("jump","jump");
makeButtons("fire","fire");
makeButtons("special","special");

let joy=null;
const stick=$("stick"),knob=$("knob");

function joyMove(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let m=Math.hypot(x,y),max=48;
 if(m>max){x=x/m*max;y=y/m*max}
 input.axis=x/max;
 knob.style.left=`calc(50% + ${x}px)`;
 knob.style.top=`calc(50% + ${y}px)`;
}

stick.onpointerdown=e=>{
 joy=e.pointerId;
 stick.setPointerCapture(joy);
 joyMove(e);
};
stick.onpointermove=e=>{
 if(e.pointerId===joy)joyMove(e);
};
function joyEnd(){
 joy=null;
 input.axis=0;
 knob.style.left="50%";
 knob.style.top="50%";
}
stick.onpointerup=joyEnd;
stick.onpointercancel=joyEnd;

addEventListener("keydown",e=>{
 if(e.key==="a"||e.key==="ArrowLeft")input.axis=-1;
 if(e.key==="d"||e.key==="ArrowRight")input.axis=1;
 if(e.key===" "||e.key==="ArrowUp")input.jump=true;
 if(e.key==="j")input.fire=true;
 if(e.key==="k")input.special=true;
});

addEventListener("keyup",e=>{
 if(["a","d","ArrowLeft","ArrowRight"].includes(e.key))input.axis=0;
 if(e.key===" "||e.key==="ArrowUp")input.jump=false;
 if(e.key==="j")input.fire=false;
 if(e.key==="k")input.special=false;
});

function buildWeaponMenu(){
 const box=$("weaponBox");
 WEAPONS.forEach((w,i)=>{
  const b=document.createElement("button");
  b.className="weapon";
  b.textContent=(i+1)+". "+w.name;
  b.onclick=()=>{
   player.weapon=i;
   syncPlayer();
  };
  box.appendChild(b);
 });
}
buildWeaponMenu();

async function enterRoom(id,host){
 try{
  roomRef=db.ref("rooms/"+id);
  let s=await roomRef.once("value");

  if(host){
   if(s.exists())return status("Código ocupado, tente novamente.");
   await roomRef.set({type:"stickfight",players:{},shots:{}});
  }else if(!s.exists()){
   return status("Sala não encontrada.");
  }

  let ps=(await roomRef.child("players").once("value")).val()||{};
  if(Object.keys(ps).length>=2&&!ps[uid])
   return status("Sala cheia.");

  player.x=host?450:6750;
  player.y=500;
  player.hp=100;

  playerRef=roomRef.child("players/"+uid);

  await playerRef.set({
   x:player.x,y:player.y,vx:0,vy:0,
   hp:100,face:player.face,weapon:player.weapon,
   stun:0,updated:Date.now()
  });

  playerRef.onDisconnect().remove();

  roomRef.child("players").on("value",snap=>{
   const all=snap.val()||{};
   const other=Object.entries(all).find(([k])=>k!==uid);
   enemyData=other?other[1]:null;
  });

  roomRef.child("shots").on("child_added",snap=>{
   const b=snap.val();
   if(b&&b.owner!==uid){
    bullets.push({
     ...b,remote:true,
     life:Math.min(1.3,b.life||1.3)
    });
   }
  });

  $("lobby").style.display="none";
  $("controls").style.display="block";
  $("hud").style.display="block";
  $("weaponBox").style.display="flex";
  $("roomname").textContent="Sala "+id;
  playing=true;

 }catch(e){
  status("Erro: "+e.message);
 }
}

$("create").onclick=()=>{
 if(uid)enterRoom(String(Math.floor(100000+Math.random()*900000)),true);
 else status("Aguarde a conexão.");
};

$("join").onclick=()=>{
 let id=$("room").value.trim();
 if(!/^\d{6}$/.test(id))return status("Digite seis números.");
 if(uid)enterRoom(id,false);
};

function syncPlayer(){
 if(playerRef){
  playerRef.update({
   x:player.x,y:player.y,vx:player.vx,vy:player.vy,
   hp:player.hp,face:player.face,weapon:player.weapon,
   stun:player.stun,updated:Date.now()
  }).catch(()=>{});
 }
}

function fireWeapon(index=player.weapon,special=false){
 const w=WEAPONS[index];
 if(player.cool>0)return;

 player.cool=w.rate;
 const pellets=special?Math.max(3,w.pellets):w.pellets;

 player.vx-=player.face*w.kick*.25;
 player.vy-=special?80:0;

 const angle=player.aim;

 for(let i=0;i<pellets;i++){
  const spread=pellets>1?
   (Math.random()-.5)*(index===14?.7:.32):0;
  const a=angle+spread;

  const b={
   x:player.x+player.face*25,
   y:player.y+18,
   vx:Math.cos(a)*w.speed*player.face,
   vy:Math.sin(a)*w.speed,
   damage:w.damage*(special?1.35:1),
   color:w.color,life:1.6,owner:uid,
   type:w.id,
   radius:index===15||index===19?8:3
  };

  bullets.push(b);
  if(!b.remote)publishShot(b);
 }

 effects.push({
  x:player.x+player.face*32,y:player.y+18,
  life:.12,max:.12,color:w.color,type:"muzzle"
 });

 if(index===16){
  grenades.push({
   x:player.x+player.face*30,y:player.y+10,
   vx:player.face*430,vy:-430,
   fuse:1.3,owner:uid
  });
 }
}

function publishShot(b){
 if(!roomRef||performance.now()-lastShotNet<25)return;
 lastShotNet=performance.now();

 const ref=roomRef.child("shots").push();
 ref.set({...b,life:1.1});

 setTimeout(()=>ref.remove().catch(()=>{}),1800);
}

function impact(x,y,color,big=false){
 for(let i=0;i<(big?35:12);i++){
  const a=Math.random()*Math.PI*2;
  const s=(big?150:80)+Math.random()*(big?650:350);

  effects.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:.25+Math.random()*.5,max:.75,
   color,type:"spark"
  });
 }

 effects.push({x,y,life:.2,max:.2,color,type:"flash"});
}

function damageOpponent(b){
 if(!enemyData||b.owner!==uid)return false;

 const dx=b.x-rival.x;
 const dy=b.y-(rival.y+20);

 if(Math.abs(dx)<25&&Math.abs(dy)<43){
  roomRef.child("players").once("value").then(s=>{
   const all=s.val()||{};
   const other=Object.keys(all).find(k=>k!==uid);
   if(!other)return;

   roomRef.child("players/"+other).transaction(p=>{
    if(p){
     p.hp=Math.max(0,(p.hp??100)-b.damage);
     p.vx=(p.vx||0)+Math.sign(b.vx)*Math.min(950,b.damage*13);
     p.vy=Math.min(p.vy||0,-Math.min(600,180+b.damage*4));
     p.stun=Math.min(.8,(p.stun||0)+.18);
    }
    return p;
   });
  });

  impact(b.x,b.y,b.color,b.damage>40);
  return true;
 }
 return false;
}

function update(dt){
 if(!playing)return;

 const ax=input.axis;

 if(Math.abs(ax)>.08){
  player.vx+=ax*1900*dt;
  player.face=Math.sign(ax);
 }

 player.vx*=Math.pow(player.ground?.82:.985,dt*60);
 player.vx=Math.max(-620,Math.min(620,player.vx));

 if(input.jump&&player.ground){
  player.vy=-800;
  player.ground=false;
 }

 player.vy+=1900*dt;
 player.vy=Math.min(player.vy,1350);

 const oldY=player.y;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.x=Math.max(20,Math.min(WORLD.w-25,player.x));

 player.ground=false;

 const body={
  x:player.x-14,y:player.y-4,w:28,h:68
 };

 for(const p of platforms){
  const r={x:p[0],y:p[1],w:p[2],h:p[3]};

  if(body.x<r.x+r.w&&body.x+body.w>r.x&&
     body.y<r.y+r.h&&body.y+body.h>r.y&&
     player.vy>=0&&oldY+64<=r.y+14){
   player.y=r.y-64;
   player.vy=0;
   player.ground=true;
   body.y=player.y-4;
  }
 }

 for(const o of props){
  if(body.x<o.x+o.w&&body.x+body.w>o.x&&
     body.y<o.y+o.h&&body.y+body.h>o.y&&
     player.vy>=0&&oldY+64<=o.y+10){
   player.y=o.y-64;
   player.vy=0;
   player.ground=true;
   body.y=player.y-4;
  }
 }

 if(player.y>1150){
  player.y=500;
  player.vy=0;
  player.hp-=12;
 }

 player.cool=Math.max(0,player.cool-dt);
 player.stun=Math.max(0,player.stun-dt);

 if(input.fire)fireWeapon();
 if(input.special)fireWeapon(player.weapon,true);

 if(enemyData){
  rival.x+=(Number(enemyData.x)-rival.x)*.25;
  rival.y+=(Number(enemyData.y)-rival.y)*.25;
  rival.vx=enemyData.vx||0;
  rival.hp=enemyData.hp??100;
  rival.face=enemyData.face||-1;
  rival.weapon=enemyData.weapon||0;
 }

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  if(!b.remote&&damageOpponent(b)){
   bullets.splice(i,1);
   continue;
  }

  if(b.life<=0||b.x<0||b.x>WORLD.w||b.y>WORLD.floor+400){
   bullets.splice(i,1);
  }
 }

 for(let i=grenades.length-1;i>=0;i--){
  const g=grenades[i];

  g.vy+=1200*dt;
  g.x+=g.vx*dt;
  g.y+=g.vy*dt;

  if(g.y>WORLD.floor-20){
   g.y=WORLD.floor-20;
   g.vy*=-.45;
   g.vx*=.72;
  }

  g.fuse-=dt;

  if(g.fuse<=0){
   if(g.owner===uid&&enemyData){
    const dx=rival.x-g.x,dy=rival.y-g.y;

    if(Math.hypot(dx,dy)<210){
     roomRef.child("players").once("value").then(s=>{
      const all=s.val()||{};
      const id=Object.keys(all).find(k=>k!==uid);

      if(id){
       roomRef.child("players/"+id).transaction(p=>{
        if(p){
         p.hp=Math.max(0,(p.hp??100)-55);
         p.vx=(p.vx||0)+Math.sign(dx)*850;
         p.vy=-650;
        }
        return p;
       });
      }
     });
    }
   }

   impact(g.x,g.y,"#ff9c45",true);
   grenades.splice(i,1);
  }
 }

 effects.forEach(e=>{
  e.life-=dt;
  e.x+=(e.vx||0)*dt;
  e.y+=(e.vy||0)*dt;
  e.vy=(e.vy||0)+500*dt;
 });
 effects=effects.filter(e=>e.life>0);

 dropClock+=dt;

 if(dropClock>30){
  dropClock=0;
  const idx=Math.floor(Math.random()*WEAPONS.length);
  drops.push({
   x:cameraX+W*.5+(Math.random()-.5)*W*.5,
   y:80,vy:0,index:idx
  });
 }

 for(let i=drops.length-1;i>=0;i--){
  const d=drops[i];
  d.vy+=1500*dt;
  d.y+=d.vy*dt;

  if(d.y>WORLD.floor-25){
   d.y=WORLD.floor-25;
   d.vy=0;
  }

  if(Math.hypot(d.x-player.x,d.y-player.y)<42){
   player.weapon=d.index;
   drops.splice(i,1);
   syncPlayer();
  }
 }

 cameraX=Math.max(0,Math.min(WORLD.w-W,player.x-W*.43));
 cameraY=WORLD.floor-Math.min(H-55,Math.max(155,H*.78));

 $("myhp").style.width=Math.max(0,player.hp)+"%";
 $("ehp").style.width=Math.max(0,rival.hp)+"%";

 if(performance.now()-lastNet>70){
  lastNet=performance.now();
  syncPlayer();
 }
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#1d2a40");
 g.addColorStop(.65,"#493c42");
 g.addColorStop(1,"#171a22");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.translate(-cameraX*.2,0);

 for(let i=0;i<26;i++){
  let x=i*330;
  ctx.fillStyle=i%2?"#292f3d":"#343441";
  ctx.beginPath();
  ctx.moveTo(x,H*.68);
  ctx.lineTo(x+110,H*.3+(i%4)*18);
  ctx.lineTo(x+250,H*.68);
  ctx.fill();
 }
 ctx.restore();
}

function drawGun(x,y,index,face=1){
 const w=WEAPONS[index];
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(face,1);
 ctx.fillStyle="#343c49";
 ctx.fillRect(-3,-5,27,10);
 ctx.fillStyle="#778696";
 ctx.fillRect(8,-8,23,7);
 ctx.fillStyle="#222";
 ctx.fillRect(1,3,8,12);
 ctx.fillStyle=w.color;
 ctx.fillRect(28,-3,5,3);
 ctx.restore();
}

function drawArena(){
 ctx.save();
 ctx.translate(-cameraX,-cameraY);

 const g=ctx.createLinearGradient(0,WORLD.floor,0,WORLD.floor+200);
 g.addColorStop(0,"#625b59");
 g.addColorStop(1,"#252a34");
 ctx.fillStyle=g;
 ctx.fillRect(0,WORLD.floor,WORLD.w,200);

 ctx.strokeStyle="#a3917e";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(0,WORLD.floor);
 ctx.lineTo(WORLD.w,WORLD.floor);
 ctx.stroke();

 for(const p of platforms.slice(1)){
  ctx.fillStyle="#625d5b";
  ctx.fillRect(p[0],p[1],p[2],p[3]);
  ctx.fillStyle="#b3a18a";
  ctx.fillRect(p[0],p[1],p[2],5);
 }

 for(let x=550;x<WORLD.w;x+=1050){
  ctx.fillStyle="#363642";
  ctx.fillRect(x,WORLD.floor-270,55,270);
  ctx.fillStyle="#82766b";
  ctx.fillRect(x-12,WORLD.floor-280,80,14);
 }

 for(const o of props){
  ctx.fillStyle=o.type==="crate"?"#825332":"#744333";
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle="#c39562";
  ctx.lineWidth=4;
  ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);
 }

 for(const d of drops){
  drawGun(d.x,d.y,d.index);
  ctx.fillStyle="#fff";
  ctx.font="12px Arial";
  ctx.fillText(WEAPONS[d.index].name,d.x-25,d.y-22);
 }

 for(const g of grenades){
  ctx.fillStyle="#76c76b";
  ctx.beginPath();
  ctx.arc(g.x,g.y,9,0,7);
  ctx.fill();
 }

 ctx.restore();
}

function fighter(p,color,isMe){
 const x=p.x-cameraX,y=p.y-cameraY,face=p.face||1;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(face,1);

 const run=isMe?
  Math.sin(performance.now()*.018)*Math.min(1,Math.abs(p.vx)/300)*15:0;

 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(0,67,22,6,0,0,7);
 ctx.fill();

 ctx.strokeStyle=color;
 ctx.lineWidth=8;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.moveTo(0,5);
 ctx.lineTo(0,38);
 ctx.stroke();

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(0,-9,12,0,7);
 ctx.fill();

 ctx.lineWidth=6;

 ctx.beginPath();
 ctx.moveTo(0,13);
 ctx.lineTo(18,22);
 ctx.lineTo(25,33);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,13);
 ctx.lineTo(-15-run,25);
 ctx.lineTo(-23-run,36);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,37);
 ctx.lineTo(12+run,52);
 ctx.lineTo(15+run,66);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,37);
 ctx.lineTo(-12-run,52);
 ctx.lineTo(-16-run,66);
 ctx.stroke();

 drawGun(24,22,p.weapon||0,1);
 ctx.restore();
}

function drawEffects(){
 ctx.save();
 ctx.translate(-cameraX,-cameraY);

 for(const e of effects){
  ctx.globalAlpha=Math.max(0,e.life/(e.max||.5));
  ctx.fillStyle=e.color;

  if(e.type==="spark"){
   ctx.beginPath();
   ctx.arc(e.x,e.y,3,0,7);
   ctx.fill();
  }else{
   ctx.beginPath();
   ctx.arc(
    e.x,e.y,
    e.type==="flash"?20*(e.life/(e.max||.2)):8,
    0,7
   );
   ctx.fill();
  }
 }

 for(const b of bullets){
  ctx.strokeStyle=b.color;
  ctx.lineWidth=b.radius||3;
  ctx.shadowBlur=12;
  ctx.shadowColor=b.color;
  ctx.beginPath();
  ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
 }

 ctx.restore();
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function draw(){
 drawBackground();
 drawArena();
 fighter(player,"#f1f3f7",true);

 if(enemyData)fighter(rival,"#f16a55",false);

 drawEffects();

 const v=ctx.createRadialGradient(
  W/2,H/2,100,W/2,H/2,Math.max(W,H)*.8
 );
 v.addColorStop(0,"#0000");
 v.addColorStop(1,"#0008");
 ctx.fillStyle=v;
 ctx.fillRect(0,0,W,H);
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000||0);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("beforeunload",()=>playerRef?.remove());
</script>
</body>
</html>

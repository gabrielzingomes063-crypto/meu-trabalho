
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#251820;font-family:Arial;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:linear-gradient(#39232b,#17151d);color:white;padding:15px}
h1{font-size:clamp(35px,8vw,65px);color:#ffca68;text-shadow:4px 4px #5a2521;text-align:center}
#menu p{font-size:17px}
button{border:2px solid #fff8;border-radius:15px;background:#bd563b;color:white;font-weight:bold;font-size:18px;padding:15px 22px;cursor:pointer}
#menu button{width:min(410px,88vw);min-height:60px}
button:active{transform:scale(.96);filter:brightness(1.2)}
input{padding:15px;border-radius:12px;border:0;font-size:18px;text-align:center;width:min(410px,88vw)}
#status{font-size:13px;color:#ffd18c;text-align:center;max-width:90vw}
#hud{display:none;position:fixed;top:10px;left:12px;right:85px;color:white;text-shadow:2px 2px #21151b;font-weight:bold;justify-content:space-between;pointer-events:none;gap:8px}
#exit{display:none;position:fixed;top:9px;right:9px;padding:11px 16px;z-index:3;font-size:14px}
#controls{display:none;position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;align-items:end;pointer-events:auto}
.ctrl{width:76px;height:76px;border-radius:50%;background:#282a38dd;border:3px solid #ffffffaa;color:white;font-size:29px;padding:0;touch-action:none;user-select:none}
#fire{width:90px;height:90px;background:#c83232e8;font-size:18px}
#jump{background:#285dcbe8}
#hint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);color:white;text-shadow:2px 2px #000;font-size:12px;pointer-events:none;white-space:nowrap}
@media(max-height:450px){.ctrl{width:60px;height:60px;font-size:23px}#fire{width:68px;height:68px}#controls{bottom:5px}#hint{bottom:75px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <h1>STICKMAN BATTLE</h1>
  <p>Uma batalha de física e destruição!</p>
  <button onclick="startGame(false)">JOGAR SOZINHO</button>
  <button onclick="createRoom()">CRIAR SALA ONLINE</button>
  <input id="roomCode" maxlength="6" placeholder="CÓDIGO DA SALA">
  <button onclick="joinRoom()">ENTRAR NA SALA</button>
  <div id="status">Conectando ao Firebase...</div>
</div>

<div id="hud">
  <span id="life">VIDA: 100</span>
  <span id="weaponLabel">ARMA: NENHUMA</span>
  <span id="roomLabel"></span>
</div>
<button id="exit" onclick="backMenu()">SAIR</button>
<div id="hint">A/D ou setas: mover • Espaço: pular • J: atirar</div>

<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="jump">↑</button>
    <button class="ctrl" id="fire">ATIRAR</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// ==========================================
// FIREBASE
// ==========================================
const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73",
 measurementId:"G-4ZZY2234EY"
};

let db=null,uid=null,room=null,online=false,roomId="";
let authReady=false;

function statusText(t){
 document.getElementById("status").textContent=t;
}

try{
 firebase.initializeApp(firebaseConfig);
 db=firebase.database();

 firebase.auth().signInAnonymously()
 .then(result=>{
   uid=result.user.uid;
   authReady=true;
   statusText("Firebase conectado!");
 })
 .catch(error=>{
   statusText("Erro de autenticação: "+error.message);
 });
}catch(error){
 statusText("Erro Firebase: "+error.message);
}

// ==========================================
// CANVAS E CONFIGURAÇÕES
// ==========================================
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,D=1;
const WORLD=4200;
let FLOOR=H-95;
let camera=0,running=false,last=0;
let keys={};
let bullets=[],particles=[],weapons=[],debris=[];
let remote={};
let dropClock=0;
let syncClock=0;
let lastShotSync=0;

function resize(){
 W=innerWidth;
 H=innerHeight;
 D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
 FLOOR=H-95;
}
addEventListener("resize",resize);
resize();

// ==========================================
// ARMAS
// ==========================================
const gunList=[
 {name:"PISTOLA",damage:14,speed:15,rate:360,color:"#ffe16b"},
 {name:"RIFLE",damage:9,speed:19,rate:120,color:"#d9e4ed"},
 {name:"SHOTGUN",damage:10,speed:13,rate:750,color:"#ff9c45",spread:5},
 {name:"SNIPER",damage:55,speed:27,rate:1000,color:"#c5a3ff"},
 {name:"METRALHADORA",damage:6,speed:20,rate:65,color:"#50d9ef"},
 {name:"LANÇA-FOGO",damage:5,speed:9,rate:55,color:"#ff642e"},
 {name:"BAZUCA",damage:65,speed:10,rate:1200,color:"#e74d3d",explosive:true},
 {name:"LASER",damage:25,speed:30,rate:400,color:"#f17cff"},
 {name:"ARCO",damage:24,speed:16,rate:600,color:"#a8d86b"},
 {name:"CANHÃO",damage:42,speed:12,rate:850,color:"#f6a14a",explosive:true},
 {name:"REVÓLVER",damage:22,speed:17,rate:480,color:"#d6b68a"},
 {name:"PLASMA",damage:19,speed:18,rate:180,color:"#53f2cb"}
];

// ==========================================
// JOGADOR
// ==========================================
const player={
 x:250,y:0,vx:0,vy:0,
 health:100,facing:1,
 grounded:false,
 weapon:null,lastShot:0,
 color:"#36d9ed",
 rag:false,ragTime:0,
 angle:0,
 hitFlash:0
};

const platforms=[
 {x:180,y:0,w:210},
 {x:540,y:0,w:230},
 {x:950,y:0,w:200},
 {x:1320,y:0,w:250},
 {x:1740,y:0,w:210},
 {x:2100,y:0,w:230},
 {x:2520,y:0,w:260},
 {x:2940,y:0,w:220},
 {x:3320,y:0,w:260},
 {x:3720,y:0,w:220}
];

function updatePlatformHeights(){
 const heights=[160,240,145,270,180,300,170,260,150,290];
 platforms.forEach((p,i)=>p.y=FLOOR-heights[i]);
}

// ==========================================
// CIDADE
// ==========================================
const buildings=[];
function makeCity(){
 buildings.length=0;
 let x=-30;
 let i=0;
 while(x<WORLD){
  const w=175+Math.random()*125;
  const h=180+Math.random()*220;
  buildings.push({
   x,y:FLOOR-h,w,h,
   color:["#713d32","#874936","#59343b","#a75c3b","#633a36"][i%5],
   seed:Math.random()
  });
  x+=w+8;
  i++;
 }
}
makeCity();
updatePlatformHeights();

// ==========================================
// INICIAR E SAIR
// ==========================================
function startGame(isOnline){
 online=isOnline;
 player.x=250;
 player.y=FLOOR-70;
 player.vx=0;
 player.vy=0;
 player.health=100;
 player.weapon=null;
 player.rag=false;
 player.hitFlash=0;

 bullets=[];
 particles=[];
 weapons=[];
 debris=[];
 remote={};
 camera=0;
 dropClock=0;
 syncClock=0;

 for(let i=0;i<9;i++)dropWeapon();

 running=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("controls").style.display="flex";
 document.getElementById("exit").style.display="block";
 document.getElementById("hint").style.display="block";

 last=0;
 requestAnimationFrame(loop);
}

function backMenu(){
 running=false;

 if(room&&uid){
  room.child("players/"+uid).remove();
  room.child("players").off();
  room.child("shots").off();
  room.child("events").off();
 }

 room=null;
 online=false;
 remote={};
 keys={};

 document.getElementById("menu").style.display="flex";
 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";
 document.getElementById("exit").style.display="none";
 document.getElementById("hint").style.display="none";
 document.getElementById("roomLabel").textContent="";
}

// ==========================================
// CRIAR E ENTRAR EM SALAS
// ==========================================
async function createRoom(){
 if(!db||!authReady){
  alert("Aguarde a conexão com o Firebase.");
  return;
 }

 const code=Math.random().toString(36).substring(2,8).toUpperCase();
 const newRoom=db.ref("rooms/"+code);

 try{
  await newRoom.set({
   created:Date.now(),
   players:{},
   shots:{},
   events:{}
  });

  roomId=code;
  room=newRoom;
  document.getElementById("roomLabel").textContent="SALA: "+code;
  startGame(true);
  connectRoom();

  alert("Sala criada! Compartilhe este código: "+code);
 }catch(error){
  alert("Não foi possível criar a sala: "+error.message);
 }
}

async function joinRoom(){
 if(!db||!authReady){
  alert("Aguarde a conexão com o Firebase.");
  return;
 }

 const code=document.getElementById("roomCode").value.trim().toUpperCase();

 if(!code){
  alert("Digite o código da sala.");
  return;
 }

 const target=db.ref("rooms/"+code);

 try{
  const snap=await target.get();

  if(!snap.exists()){
   alert("Essa sala não existe.");
   return;
  }

  roomId=code;
  room=target;
  document.getElementById("roomLabel").textContent="SALA: "+code;

  startGame(true);
  connectRoom();
 }catch(error){
  alert("Erro ao entrar na sala: "+error.message);
 }
}

function connectRoom(){
 if(!room||!uid)return;

 room.child("players/"+uid).onDisconnect().remove();

 room.child("players").on("value",snapshot=>{
  remote=snapshot.val()||{};
  delete remote[uid];
 });

 room.child("shots").limitToLast(30).on("child_added",snapshot=>{
  const shot=snapshot.val();
  if(!shot||shot.owner===uid)return;

  bullets.push({
   x:shot.x,y:shot.y,
   vx:shot.vx,vy:shot.vy,
   damage:shot.damage,
   color:shot.color,
   owner:shot.owner,
   explosive:shot.explosive,
   life:180
  });
 });

 room.child("events").limitToLast(20).on("child_added",snapshot=>{
  const event=snapshot.val();
  if(!event||event.owner===uid)return;
  if(event.type==="hit"){
   addExplosion(event.x,event.y,12,event.color||"#ffb347");
  }
 });
}

function syncPlayer(){
 if(!online||!room||!uid)return;

 room.child("players/"+uid).update({
  x:player.x,
  y:player.y,
  vx:player.vx,
  vy:player.vy,
  health:player.health,
  facing:player.facing,
  color:player.color,
  weapon:player.weapon?player.weapon.name:"",
  rag:player.rag,
  updated:Date.now()
 }).catch(()=>{});
}

// ==========================================
// CONTROLES
// ==========================================
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function bindButton(id,key){
 const button=document.getElementById(id);

 function down(e){
  e.preventDefault();
  keys[key]=true;
  button.setPointerCapture?.(e.pointerId);
  button.style.filter="brightness(1.5)";
 }

 function up(e){
  e.preventDefault();
  keys[key]=false;
  button.style.filter="";
 }

 button.addEventListener("pointerdown",down);
 button.addEventListener("pointerup",up);
 button.addEventListener("pointercancel",up);
 button.addEventListener("lostpointercapture",up);
}

bindButton("left","a");
bindButton("right","d");
bindButton("jump","w");
bindButton("fire","shoot");

// ==========================================
// ARMAS E COLETA
// ==========================================
function dropWeapon(){
 const gun=gunList[Math.floor(Math.random()*gunList.length)];

 weapons.push({
  x:200+Math.random()*(WORLD-400),
  y:FLOOR-250-Math.random()*150,
  vx:(Math.random()-.5)*2,
  vy:0,
  gun
 });
}

function collectWeapons(){
 for(let i=weapons.length-1;i>=0;i--){
  const w=weapons[i];

  if(Math.abs(player.x-w.x)<38&&Math.abs(player.y+30-w.y)<55){
   player.weapon=w.gun;
   weapons.splice(i,1);
   addExplosion(player.x,player.y+30,8,w.gun.color);
  }
 }
}

// ==========================================
// TIROS
// ==========================================
function shoot(){
 if(!player.weapon||player.rag)return;

 const gun=player.weapon;
 const now=Date.now();

 if(now-player.lastShot<gun.rate)return;
 player.lastShot=now;

 const count=gun.spread||1;

 for(let i=0;i<count;i++){
  const angle=(i-(count-1)/2)*0.13;
  const direction=player.facing;

  const shot={
   x:player.x+direction*24,
   y:player.y+29,
   vx:Math.cos(angle)*gun.speed*direction,
   vy:Math.sin(angle)*gun.speed,
   damage:gun.damage,
   color:gun.color,
   owner:uid||"solo",
   explosive:!!gun.explosive,
   life:180
  };

  bullets.push(shot);

  if(online&&room&&uid){
   room.child("shots").push({
    x:shot.x,y:shot.y,
    vx:shot.vx,vy:shot.vy,
    damage:shot.damage,
    color:shot.color,
    owner:uid,
    explosive:shot.explosive
   }).catch(()=>{});
  }
 }

 player.vx-=player.facing*(gun.damage>40?2.5:0.7);
 addParticles(player.x+player.facing*27,player.y+28,4,gun.color);
}

function updateBullets(step){
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];

  b.x+=b.vx*step;
  b.y+=b.vy*step;
  b.life--;

  if(b.explosive)b.vy+=0.12*step;

  if(b.life<=0||b.x<0||b.x>WORLD||b.y>H+300){
   bullets.splice(i,1);
   continue;
  }

  // Dano em jogadores online
  if(online&&b.owner===uid){
   for(const id in remote){
    const target=remote[id];
    if(!target||target.health<=0)continue;

    if(Math.abs(b.x-target.x-15)<25&&Math.abs(b.y-target.y-30)<38){
     const newHealth=Math.max(0,(target.health||100)-b.damage);

     room.child("players/"+id+"/health").set(newHealth).catch(()=>{});

     if(b.explosive)addExplosion(b.x,b.y,28,b.color);

     room.child("events").push({
      type:"hit",owner:uid,x:b.x,y:b.y,color:b.color
     });

     bullets.splice(i,1);
     break;
    }
   }
  }
 }
}

// ==========================================
// FÍSICA E RAGDOLL SIMPLIFICADO
// ==========================================
function physics(dt){
 const step=Math.min(dt/16.67,2);

 if(player.rag){
  player.ragTime-=dt;
  player.vy+=0.55*step;
  player.x+=player.vx*step;
  player.y+=player.vy*step;
  player.angle+=0.12*step;
  player.vx*=0.985;

  if(player.y+62>=FLOOR){
   player.y=FLOOR-62;
   player.vy*=-0.22;
   player.vx*=0.75;
  }

  if(player.ragTime<=0){
   player.rag=false;
   player.angle=0;
   player.vx=0;
   player.vy=0;
  }
  return;
 }

 if(keys.a||keys.arrowleft){
  player.vx-=0.8*step;
  player.facing=-1;
 }
 if(keys.d||keys.arrowright){
  player.vx+=0.8*step;
  player.facing=1;
 }

 player.vx*=Math.pow(0.84,step);
 player.vx=Math.max(-7,Math.min(7,player.vx));

 if((keys.w||keys.arrowup||keys[" "])&&player.grounded){
  player.vy=-14;
  player.grounded=false;
 }

 if(keys.shoot||keys.j)shoot();

 player.vy+=0.58*step;
 player.vy=Math.min(player.vy,17);

 const oldBottom=player.y+62;
 player.x+=player.vx*step;
 player.x=Math.max(0,Math.min(WORLD-30,player.x));
 player.y+=player.vy*step;

 player.grounded=false;

 if(player.y+62>=FLOOR){
  player.y=FLOOR-62;
  player.vy=0;
  player.grounded=true;
 }

 for(const p of platforms){
  const overlap=player.x+20>p.x&&player.x<p.x+p.w;
  if(overlap&&player.vy>=0&&oldBottom<=p.y+15&&player.y+62>=p.y){
   player.y=p.y-62;
   player.vy=0;
   player.grounded=true;
  }
 }

 if(player.y>H+300)player.health=0;

 collectWeapons();

 dropClock+=dt;
 if(dropClock>=40000){
  dropWeapon();
  dropWeapon();
  dropClock=0;
 }

 player.hitFlash=Math.max(0,player.hitFlash-dt);
}

// ==========================================
// PARTÍCULAS E EXPLOSÕES
// ==========================================
function addParticles(x,y,amount,color){
 for(let i=0;i<amount;i++){
  const a=Math.random()*Math.PI*2;
  const speed=1+Math.random()*6;

  particles.push({
   x,y,
   vx:Math.cos(a)*speed,
   vy:Math.sin(a)*speed,
   life:25+Math.random()*35,
   size:2+Math.random()*5,
   color
  });
 }
}

function addExplosion(x,y,amount,color){
 addParticles(x,y,amount,color);
 addParticles(x,y,Math.floor(amount/2),"#ffdc8a");

 for(let i=0;i<8;i++){
  debris.push({
   x,y,
   vx:(Math.random()-.5)*12,
   vy:-Math.random()*10,
   life:80,
   size:4+Math.random()*7
  });
 }
}

function updateEffects(step){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*step;
  p.y+=p.vy*step;
  p.vy+=0.13*step;
  p.vx*=0.98;
  p.life-=step;
  if(p.life<=0)particles.splice(i,1);
 }

 for(let i=debris.length-1;i>=0;i--){
  const p=debris[i];
  p.x+=p.vx*step;
  p.y+=p.vy*step;
  p.vy+=0.4*step;
  p.life-=step;
  if(p.y>FLOOR-5){
   p.y=FLOOR-5;
   p.vy*=-0.3;
   p.vx*=0.7;
  }
  if(p.life<=0)debris.splice(i,1);
 }
}

// ==========================================
// DESENHO DO CENÁRIO
// ==========================================
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#5c3440");
 g.addColorStop(.45,"#c76b47");
 g.addColorStop(1,"#f5a65d");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // Sol
 ctx.fillStyle="#ffc66b";
 ctx.beginPath();
 ctx.arc(W*.75,H*.27,Math.min(W,H)*.13,0,Math.PI*2);
 ctx.fill();

 // Brilho do sol
 ctx.fillStyle="#ffdb8b33";
 ctx.beginPath();
 ctx.arc(W*.75,H*.27,Math.min(W,H)*.2,0,Math.PI*2);
 ctx.fill();
}

function drawBuildings(){
 for(const b of buildings){
  const x=b.x-camera*.65;
  if(x+b.w<0||x>W)continue;

  ctx.fillStyle=b.color;
  ctx.fillRect(x,b.y,b.w,b.h);

  ctx.fillStyle="#432b30";
  ctx.fillRect(x,b.y,b.w,8);

  const cols=Math.max(2,Math.floor(b.w/48));
  const rows=Math.max(2,Math.floor(b.h/45));

  for(let c=0;c<cols;c++){
   for(let r=0;r<rows;r++){
    const wx=x+12+c*((b.w-25)/cols);
    const wy=b.y+22+r*42;

    ctx.fillStyle=(Math.sin(c*12+r*4+b.seed*20)>0.15)?"#f9b65b":"#38252d";
    ctx.fillRect(wx,wy,19,27);
    ctx.strokeStyle="#291e28";
    ctx.lineWidth=2;
    ctx.strokeRect(wx,wy,19,27);
   }
  }

  // Telhado
  ctx.fillStyle="#33232a";
  ctx.fillRect(x-5,b.y-7,b.w+10,8);
 }
}

function drawPlatforms(){
 for(const p of platforms){
  const x=p.x-camera;
  if(x+p.w<0||x>W)continue;

  ctx.fillStyle="#e6a65b";
  ctx.fillRect(x,p.y,p.w,12);
  ctx.fillStyle="#60392f";
  ctx.fillRect(x,p.y+12,p.w,13);
  ctx.fillStyle="#39262a";
  ctx.fillRect(x,p.y+25,p.w,4);
 }
}

function drawFloor(){
 ctx.fillStyle="#462d2c";
 ctx.fillRect(0,FLOOR,W,H-FLOOR);
 ctx.fillStyle="#d78b48";
 ctx.fillRect(0,FLOOR,W,8);
 ctx.fillStyle="#271d24";
 ctx.fillRect(0,FLOOR+8,W,5);
}

function drawCity(){
 drawSky();
 drawBuildings();
 drawPlatforms();
 drawFloor();
}

// ==========================================
// PERSONAGENS
// ==========================================
function drawStickman(x,y,color,facing,isPlayer,rag,angle){
 ctx.save();
 ctx.translate(x-camera+15,y+31);
 ctx.rotate(angle||0);

 const swing=Math.sin(performance.now()/110+(isPlayer?0:2))*5;
 ctx.strokeStyle=color;
 ctx.lineWidth=5;
 ctx.lineCap="round";
 ctx.lineJoin="round";

 if(rag){
  ctx.rotate(.3);
 }

 // Cabeça
 ctx.beginPath();
 ctx.arc(0,-23,10,0,Math.PI*2);
 ctx.stroke();

 // Corpo
 ctx.beginPath();
 ctx.moveTo(0,-13);
 ctx.lineTo(0,13);
 ctx.stroke();

 // Braços
 ctx.beginPath();
 ctx.moveTo(0,-8);
 ctx.lineTo(-13,-1+swing);
 ctx.lineTo(-19,7+swing);
 ctx.moveTo(0,-8);
 ctx.lineTo(13,-2-swing);
 ctx.lineTo(19,5-swing);
 ctx.stroke();

 // Pernas
 ctx.beginPath();
 ctx.moveTo(0,13);
 ctx.lineTo(-10,31+swing);
 ctx.lineTo(-16,31+swing);
 ctx.moveTo(0,13);
 ctx.lineTo(10,31-swing);
 ctx.lineTo(16,31-swing);
 ctx.stroke();

 if(isPlayer&&player.weapon){
  ctx.strokeStyle=player.weapon.color;
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(facing*8,-3);
  ctx.lineTo(facing*31,-3);
  ctx.stroke();
 }

 ctx.restore();
}

function drawPlayers(){
 drawStickman(player.x,player.y,player.hitFlash?"#ffffff":player.color,player.facing,true,player.rag,player.angle);

 for(const id in remote){
  const p=remote[id];
  if(!p||typeof p.x!=="number")continue;
  drawStickman(p.x,p.y,p.color||"#ff5555",p.facing||1,false,p.rag,false);

  ctx.fillStyle="#fff";
  ctx.font="12px Arial";
  ctx.fillText("JOGADOR",p.x-camera-15,p.y-10);

  ctx.fillStyle="#241b25";
  ctx.fillRect(p.x-camera-12,p.y-18,40,5);
  ctx.fillStyle="#65e879";
  ctx.fillRect(p.x-camera-12,p.y-18,40*Math.max(0,p.health||0)/100,5);
 }
}

// ==========================================
// DESENHO DE ARMAS, TIROS E EFEITOS
// ==========================================
function drawWeapons(){
 for(const w of weapons){
  const x=w.x-camera;
  if(x<-40||x>W+40)continue;

  ctx.save();
  ctx.translate(x,w.y);
  ctx.rotate(Math.sin(performance.now()/200)*.12);

  ctx.fillStyle=w.gun.color;
  ctx.fillRect(-15,-5,30,10);
  ctx.fillRect(5,-9,8,5);
  ctx.fillStyle="#211c24";
  ctx.fillRect(-12,4,7,8);

  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.font="11px Arial";
  ctx.textAlign="center";
  ctx.fillText(w.gun.name,x,w.y-15);
  ctx.textAlign="left";
 }
}

function drawBullets(){
 for(const b of bullets){
  ctx.fillStyle=b.color;
  ctx.shadowBlur=12;
  ctx.shadowColor=b.color;
  ctx.beginPath();
  ctx.arc(b.x-camera,b.y,4,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }
}

function drawEffects(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/45);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x-camera,p.y,p.size,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 for(const p of debris){
  ctx.fillStyle="#34252a";
  ctx.fillRect(p.x-camera,p.y,p.size,p.size);
 }
}

function draw(){
 drawCity();
 drawWeapons();
 drawBullets();
 drawEffects();
 drawPlayers();
}

// ==========================================
// LOOP PRINCIPAL
// ==========================================
function loop(time){
 if(!running)return;

 const dt=Math.min(time-(last||time),40);
 last=time;

 physics(dt);
 updateBullets(Math.min(dt/16.67,2));
 updateEffects(Math.min(dt/16.67,2));

 camera=player.x-W/2;
 camera=Math.max(0,Math.min(WORLD-W,camera));

 document.getElementById("life").textContent="VIDA: "+Math.max(0,Math.floor(player.health));
 document.getElementById("weaponLabel").textContent="ARMA: "+(player.weapon?player.weapon.name:"NENHUMA");

 syncClock+=dt;
 if(online&&syncClock>=70){
  syncPlayer();
  syncClock=0;
 }

 draw();

 if(player.health<=0){
  player.health=0;
  player.rag=true;
  player.ragTime=1000;
  running=false;
  setTimeout(()=>{
   alert("Você foi derrotado!");
   backMenu();
  },500);
  return;
 }

 requestAnimationFrame(loop);
}
</script>
</body>
</html>

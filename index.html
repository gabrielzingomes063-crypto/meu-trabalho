
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151923;font-family:Arial;touch-action:none}
canvas{width:100%;height:100%;display:block}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#151923;z-index:5;padding:20px}
.panel{background:#252d3e;padding:25px;border-radius:18px;width:min(400px,100%);color:white}
input,button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:9px;font-size:16px}
button{background:#d84c35;color:white;font-weight:bold}
#status{color:#ffd28a;margin-top:10px}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:white;display:none;background:#111b;padding:10px;border-radius:10px}
#controls{position:fixed;inset:0;display:none;pointer-events:none}
#stick{position:absolute;left:22px;bottom:25px;width:145px;height:145px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff77;pointer-events:auto}
#knob{position:absolute;width:60px;height:60px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ddd;border:3px solid white}
.ctrl{position:absolute;border-radius:50%;display:grid;place-items:center;color:white;font-weight:bold;background:#ffffff33;border:2px solid white;pointer-events:auto}
#jump{right:25px;bottom:30px;width:78px;height:78px;font-size:32px;background:#287acb}
#attack{right:115px;bottom:35px;width:82px;height:82px;background:#c43e32}
#strong{right:35px;bottom:125px;width:62px;height:62px;background:#8346a9}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="lobby">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <p>Jogue online com outra pessoa!</p>
  <button id="create">CRIAR SALA</button>
  <input id="room" placeholder="Código da sala" maxlength="6">
  <button id="join">ENTRAR NA SALA</button>
  <div id="status">Conectando...</div>
 </div>
</div>

<div id="hud">STICKMAN BATTLE</div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="attack" class="ctrl">ATACAR</div>
 <div id="jump" class="ctrl">↑</div>
 <div id="strong" class="ctrl">FORTE</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let uid=null,roomRef=null,playerRef=null,enemy=null,playing=false;
auth.signInAnonymously().then(c=>{
 uid=c.user.uid;
 status("Conectado! Crie ou entre em uma sala.");
}).catch(e=>status(e.message));

function status(t){document.getElementById("status").textContent=t}

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

const world={width:6200,floor:720};
let cameraX=0,cameraY=0;

const player={
 x:420,y:470,vx:0,vy:0,hp:100,
 face:1,ground:false,attack:0,cooldown:0,
 weapon:null
};

let opponent={x:5600,y:470,hp:100,face:-1,weapon:null};
let enemyData=null;

const platforms=[
 [0,720,6200,180],
 [350,590,360,26],[900,520,310,26],
 [1420,610,440,26],[2020,535,370,26],
 [2630,625,500,26],[3300,540,420,26],
 [3900,610,500,26],[4650,520,430,26],
 [5300,610,420,26],[740,390,220,22],
 [2350,360,300,22],[4250,370,280,22],
 [5650,400,250,22]
];

const objects=[];
for(let x=250;x<6100;x+=520){
 objects.push({x,y:655,w:70,h:65,type:x%2?"crate":"barrel"});
}
objects.push(
 {x:1100,y:485,w:60,h:35,type:"stone"},
 {x:2860,y:590,w:70,h:35,type:"stone"},
 {x:4850,y:485,w:80,h:35,type:"stone"}
);

let weapons=[],particles=[],weaponClock=0;

async function enterRoom(id,host){
 try{
  roomRef=db.ref("rooms/"+id);
  const snap=await roomRef.once("value");

  if(host){
   if(snap.exists())return status("Tente criar outra sala.");
   await roomRef.set({type:"stickfight",players:{}});
  }else if(!snap.exists()){
   return status("Sala não encontrada.");
  }

  const players=(await roomRef.child("players").once("value")).val()||{};
  if(Object.keys(players).length>=2&&!players[uid])
   return status("Sala cheia.");

  player.x=host?420:5600;
  player.y=470;
  player.hp=100;

  playerRef=roomRef.child("players/"+uid);
  await playerRef.set({
   x:player.x,y:player.y,vx:0,vy:0,
   hp:100,face:player.face,weapon:null
  });
  playerRef.onDisconnect().remove();

  roomRef.child("players").on("value",s=>{
   const all=s.val()||{};
   const other=Object.entries(all).find(([id])=>id!==uid);
   enemyData=other?other[1]:null;
  });

  document.getElementById("lobby").style.display="none";
  document.getElementById("controls").style.display="block";
  document.getElementById("hud").style.display="block";
  playing=true;
 }catch(e){status(e.message)}
}

document.getElementById("create").onclick=()=>{
 if(!uid)return status("Aguarde a conexão.");
 enterRoom(String(Math.floor(100000+Math.random()*900000)),true);
};

document.getElementById("join").onclick=()=>{
 const id=document.getElementById("room").value.trim();
 if(!/^\d{6}$/.test(id))return status("Digite 6 números.");
 if(uid)enterRoom(id,false);
};

const input={axis:0,jump:false,attack:false,strong:false};

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let joyId=null;

function moveJoystick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=48;
 const length=Math.hypot(dx,dy);
 if(length>max){dx=dx/length*max;dy=dy/length*max}
 input.axis=dx/max;
 knob.style.left=`calc(50% + ${dx}px)`;
 knob.style.top=`calc(50% + ${dy}px)`;
}

stick.onpointerdown=e=>{
 joyId=e.pointerId;
 stick.setPointerCapture(joyId);
 moveJoystick(e);
};
stick.onpointermove=e=>{if(e.pointerId===joyId)moveJoystick(e)};
function releaseJoystick(){
 joyId=null;input.axis=0;
 knob.style.left="50%";knob.style.top="50%";
}
stick.onpointerup=releaseJoystick;
stick.onpointercancel=releaseJoystick;

function hold(id,key){
 const el=document.getElementById(id);
 el.onpointerdown=e=>{e.preventDefault();input[key]=true};
 el.onpointerup=()=>input[key]=false;
 el.onpointercancel=()=>input[key]=false;
 el.onlostpointercapture=()=>input[key]=false;
}
hold("jump","jump");
hold("attack","attack");
hold("strong","strong");

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")input.axis=-1;
 if(e.key==="ArrowRight"||e.key==="d")input.axis=1;
 if(e.key===" "||e.key==="ArrowUp")input.jump=true;
 if(e.key==="j")input.attack=true;
 if(e.key==="k")input.strong=true;
});
addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))input.axis=0;
 if(e.key===" "||e.key==="ArrowUp")input.jump=false;
 if(e.key==="j")input.attack=false;
 if(e.key==="k")input.strong=false;
});

function collision(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&
 a.y<b.y+b.h&&a.y+a.h>b.y;
}

function spawnWeapon(){
 const types=["sword","axe","hammer","blaster"];
 const type=types[Math.floor(Math.random()*types.length)];
 weapons.push({
  type,x:cameraX+W*.5+(Math.random()-.5)*W*.5,
  y:80,vx:(Math.random()-.5)*100,vy:0,rotation:0
 });
}

function hitEnemy(damage,power){
 if(!enemyData)return;
 const dx=opponent.x-player.x;
 const dy=opponent.y-player.y;

 if(Math.abs(dx)<110&&Math.abs(dy)<90&&
 Math.sign(dx||1)===player.face){
  roomRef.child("players").once("value").then(s=>{
   const all=s.val()||{};
   const id=Object.keys(all).find(k=>k!==uid);
   if(!id)return;
   roomRef.child("players/"+id).transaction(p=>{
    if(p){
     p.hp=Math.max(0,(p.hp??100)-damage);
     p.vx=(p.vx||0)+player.face*power;
     p.vy=-300;
    }
    return p;
   });
  });

  for(let i=0;i<12;i++){
   particles.push({
    x:player.x+player.face*35,y:player.y+25,
    vx:player.face*(80+Math.random()*240),
    vy:-100+Math.random()*180,life:.4
   });
  }
 }
}

function update(dt){
 if(!playing)return;

 const axis=input.axis;
 if(Math.abs(axis)>.08){
  player.vx+=axis*1800*dt;
  player.face=Math.sign(axis);
 }

 player.vx*=Math.pow(.84,dt*60);
 player.vx=Math.max(-560,Math.min(560,player.vx));

 if(input.jump&&player.ground){
  player.vy=-760;
  player.ground=false;
 }

 player.vy+=1850*dt;
 player.vy=Math.min(player.vy,1250);

 const oldY=player.y;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.x=Math.max(20,Math.min(world.width-30,player.x));

 player.ground=false;
 const body={x:player.x-15,y:player.y-5,w:30,h:70};

 for(const p of platforms){
  const platform={x:p[0],y:p[1],w:p[2],h:p[3]};
  if(collision(body,platform)&&player.vy>=0&&
     oldY+65<=platform.y+12){
   player.y=platform.y-65;
   player.vy=0;
   player.ground=true;
   body.y=player.y-5;
  }
 }

 for(const o of objects){
  const ob={x:o.x,y:o.y,w:o.w,h:o.h};
  if(collision(body,ob)&&player.vy>=0&&oldY+65<=o.y+12){
   player.y=o.y-65;
   player.vy=0;
   player.ground=true;
   body.y=player.y-5;
  }
 }

 if(player.y>1100){
  player.y=450;player.vy=0;player.hp-=10;
 }

 player.cooldown=Math.max(0,player.cooldown-dt);
 player.attack=Math.max(0,player.attack-dt);

 if((input.attack||input.strong)&&player.cooldown<=0){
  const strong=input.strong;
  player.attack=strong?.35:.2;
  player.cooldown=strong?.8:.42;
  hitEnemy(strong?22:12,strong?850:540);
 }

 if(enemyData){
  opponent.x+=(Number(enemyData.x)-opponent.x)*.25;
  opponent.y+=(Number(enemyData.y)-opponent.y)*.25;
  opponent.hp=enemyData.hp??100;
  opponent.face=enemyData.face||-1;
  opponent.weapon=enemyData.weapon||null;
 }

 weapons.forEach(w=>{
  w.vy+=1850*dt;
  w.x+=w.vx*dt;
  w.y+=w.vy*dt;
  w.rotation+=w.vx*dt*.01;
  if(w.y>world.floor-30){
   w.y=world.floor-30;
   w.vy*=-.25;
   w.vx*=.8;
  }
 });

 for(let i=weapons.length-1;i>=0;i--){
  const w=weapons[i];
  if(Math.hypot(w.x-player.x,w.y-player.y-25)<45&&!player.weapon){
   player.weapon=w.type;
   weapons.splice(i,1);
  }
 }

 weaponClock+=dt;
 if(weaponClock>24){weaponClock=0;spawnWeapon()}

 particles.forEach(p=>{
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=600*dt;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);

 cameraX=Math.max(0,Math.min(world.width-W,player.x-W*.43));
 const floorScreen=Math.min(H-58,Math.max(150,H*.78));
 cameraY=world.floor-floorScreen;

 if(playerRef&&performance.now()%65<20){
  playerRef.update({
   x:player.x,y:player.y,vx:player.vx,vy:player.vy,
   hp:player.hp,face:player.face,weapon:player.weapon
  }).catch(()=>{});
 }
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#202c43");
 g.addColorStop(.65,"#443b42");
 g.addColorStop(1,"#171a22");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.save();ctx.translate(-cameraX*.2,0);
 for(let i=0;i<25;i++){
  const x=i*310;
  ctx.fillStyle=i%2?"#292f3d":"#343441";
  ctx.beginPath();
  ctx.moveTo(x,H*.62);
  ctx.lineTo(x+110,H*.3+(i%4)*15);
  ctx.lineTo(x+240,H*.62);
  ctx.fill();
 }
 ctx.restore();
}

function drawWeapon(x,y,type,rotation=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rotation);
 ctx.lineCap="round";
 ctx.strokeStyle="#714c30";ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(18,0);ctx.stroke();

 if(type==="sword"){
  ctx.fillStyle="#d9e4ef";
  ctx.beginPath();ctx.moveTo(8,-5);ctx.lineTo(38,0);
  ctx.lineTo(8,5);ctx.fill();
  ctx.strokeStyle="#d4ad5c";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(3,-10);ctx.lineTo(3,10);ctx.stroke();
 }
 if(type==="axe"){
  ctx.fillStyle="#b8c4d0";
  ctx.beginPath();ctx.moveTo(4,-4);ctx.quadraticCurveTo(30,-25,35,-2);
  ctx.quadraticCurveTo(30,20,4,4);ctx.fill();
 }
 if(type==="hammer"){
  ctx.fillStyle="#818d9c";ctx.fillRect(8,-15,26,30);
 }
 if(type==="blaster"){
  ctx.fillStyle="#4f9db7";ctx.fillRect(3,-8,30,16);
  ctx.fillStyle="#dcebf2";ctx.fillRect(25,-4,12,8);
 }
 ctx.restore();
}

function drawObjects(){
 for(const o of objects){
  if(o.type==="crate"){
   ctx.fillStyle="#805332";ctx.fillRect(o.x,o.y,o.w,o.h);
   ctx.strokeStyle="#d09a5d";ctx.lineWidth=5;
   ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);
   ctx.beginPath();
   ctx.moveTo(o.x+5,o.y+5);ctx.lineTo(o.x+o.w-5,o.y+o.h-5);
   ctx.moveTo(o.x+o.w-5,o.y+5);ctx.lineTo(o.x+5,o.y+o.h-5);
   ctx.stroke();
  }else if(o.type==="barrel"){
   ctx.fillStyle="#704334";ctx.beginPath();
   ctx.roundRect(o.x,o.y,o.w,o.h,12);ctx.fill();
   ctx.strokeStyle="#c09a67";ctx.lineWidth=5;
   ctx.strokeRect(o.x+2,o.y+8,o.w-4,5);
   ctx.strokeRect(o.x+2,o.y+o.h-14,o.w-4,5);
  }else{
   ctx.fillStyle="#85878a";ctx.beginPath();
   ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+12,o.y+5);
   ctx.lineTo(o.x+o.w-10,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);
   ctx.fill();
  }
 }
}

function arena(){
 ctx.save();ctx.translate(-cameraX,-cameraY);

 const ground=ctx.createLinearGradient(0,world.floor,0,world.floor+180);
 ground.addColorStop(0,"#615a59");ground.addColorStop(1,"#292d36");
 ctx.fillStyle=ground;ctx.fillRect(0,world.floor,world.width,180);

 ctx.strokeStyle="#a18f7d";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(0,world.floor);
 ctx.lineTo(world.width,world.floor);ctx.stroke();

 for(const p of platforms.slice(1)){
  ctx.fillStyle="#625b5a";ctx.fillRect(p[0],p[1],p[2],p[3]);
  ctx.fillStyle="#b1a18b";ctx.fillRect(p[0],p[1],p[2],5);
  ctx.fillStyle="#303039";
  for(let x=p[0]+15;x<p[0]+p[2];x+=38)ctx.fillRect(x,p[1]+9,5,8);
 }

 for(let x=600;x<world.width;x+=1050){
  ctx.fillStyle="#373744";
  ctx.fillRect(x,world.floor-250,54,250);
  ctx.fillStyle="#77706b";
  ctx.fillRect(x-12,world.floor-258,78,14);
  ctx.fillRect(x+8,world.floor-330,12,72);
 }

 drawObjects();
 weapons.forEach(w=>drawWeapon(w.x,w.y,w.type,w.rotation));
 ctx.restore();
}

function fighter(x,y,face,color,attack,weapon){
 ctx.save();
 ctx.translate(x-cameraX,y-cameraY);
 ctx.scale(face,1);

 const run=Math.sin(performance.now()*.014)*Math.min(1,Math.abs(player.vx)/300)*16;
 const bob=Math.sin(performance.now()*.012)*2;

 ctx.fillStyle="#0007";
 ctx.beginPath();ctx.ellipse(0,67,24,6,0,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(0,5+bob);ctx.lineTo(0,38+bob);ctx.stroke();

 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(0,-9+bob,12,0,Math.PI*2);ctx.fill();

 const arm=attack>0?30:15+run*.5;
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.moveTo(0,12);ctx.lineTo(arm,attack>0?-2:22);
 ctx.lineTo(arm+8,35);ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,13);ctx.lineTo(-14-run*.4,25);
 ctx.lineTo(-22-run*.4,36);ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,37);ctx.lineTo(12+run,52);
 ctx.lineTo(15+run,66);ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,37);ctx.lineTo(-12-run,52);
 ctx.lineTo(-16-run,66);ctx.stroke();

 if(weapon)drawWeapon(arm+18,35,weapon);
 ctx.restore();
}

function draw(){
 background();arena();

 fighter(player.x,player.y,player.face,"#f2f4f7",player.attack,player.weapon);

 if(enemyData){
  fighter(opponent.x,opponent.y,opponent.face,"#f06b55",0,opponent.weapon);
 }

 ctx.save();ctx.translate(-cameraX,-cameraY);
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle="#ffd27a";
  ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();ctx.globalAlpha=1;

 const v=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,Math.max(W,H)*.75);
 v.addColorStop(0,"#0000");v.addColorStop(1,"#0008");
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000||0);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

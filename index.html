
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b27;font-family:Arial;touch-action:none;color:white}
canvas{width:100%;height:100%;display:block}
#menu{position:fixed;inset:0;background:linear-gradient(#171b27dd,#171b27f5);display:grid;place-items:center;z-index:10}
.panel{background:#30384a;padding:24px;border-radius:18px;width:min(390px,92%);text-align:center;box-shadow:0 12px 40px #0009}
h1{font-size:32px;margin:5px;color:#ffcf68;text-shadow:3px 3px #6e382a}
button,input{border:0;border-radius:9px;padding:13px;font-size:15px}
button{background:#e75a40;color:white;font-weight:bold;cursor:pointer}
input{width:100%;margin:8px 0;background:#e9e9e9}
#status{font-size:12px;color:#ffd58b;margin-top:10px}
#hud{position:fixed;top:9px;left:50%;transform:translateX(-50%);display:none;text-align:center;background:#171b27bb;padding:8px 15px;border-radius:12px;z-index:3}
.health{display:flex;gap:8px;align-items:center;font-size:11px}
.bar{width:100px;height:10px;background:#612e35;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#62df80;width:100%}
#weapons{position:fixed;top:65px;left:50%;transform:translateX(-50%);display:none;z-index:4;gap:4px;flex-wrap:wrap;justify-content:center;width:95%;max-width:700px}
#weapons button{font-size:10px;padding:6px 8px;background:#39465c;border:1px solid #8290a2}
#controls{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
#stick{position:absolute;left:20px;bottom:20px;width:135px;height:135px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff77;pointer-events:auto}
#knob{position:absolute;width:57px;height:57px;border-radius:50%;background:#eeeeeedb;left:50%;top:50%;transform:translate(-50%,-50%)}
.ctrl{position:absolute;border-radius:50%;display:grid;place-items:center;background:#ffffff35;border:2px solid #ffffffa0;font-weight:bold;pointer-events:auto;user-select:none}
#jump{right:24px;bottom:24px;width:75px;height:75px;background:#3284d4c9;font-size:30px}
#shoot{right:110px;bottom:29px;width:82px;height:82px;background:#d94335dc;font-size:13px}
#special{right:34px;bottom:115px;width:60px;height:60px;background:#9b54c7;font-size:11px}
#roomlabel{font-size:11px;color:#ffda91}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <p>Combate caótico • Armas • Explosões</p>
  <button id="solo" style="width:100%">JOGAR</button>
  <p style="font-size:12px">MULTIPLAYER ONLINE EXPERIMENTAL</p>
  <button id="create" style="width:100%">CRIAR SALA ONLINE</button>
  <input id="roomcode" placeholder="Código da sala">
  <button id="join" style="width:100%">ENTRAR NA SALA</button>
  <div id="status">Modo local disponível.</div>
 </div>
</div>

<div id="hud">
 <div class="health">
  <span>VOCÊ</span><div class="bar"><div id="hp1" class="fill"></div></div>
  <span>RIVAL</span><div class="bar"><div id="hp2" class="fill"></div></div>
 </div>
 <div id="roomlabel"></div>
</div>

<div id="weapons"></div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="shoot" class="ctrl">ATIRAR</div>
 <div id="jump" class="ctrl">↑</div>
 <div id="special" class="ctrl">ESPECIAL</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";

// FIREBASE
const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73"
};

let db=null,uid=null,room=null,playerRef=null;
try{
 firebase.initializeApp(firebaseConfig);
 db=firebase.database();
 firebase.auth().signInAnonymously().then(c=>{
  uid=c.user.uid;
  $("status").textContent="Firebase conectado.";
 }).catch(e=>$("status").textContent="Erro Firebase: "+e.message);
}catch(e){}

const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
let W,H,D=1;

function resize(){
 W=innerWidth;H=innerHeight;
 D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

// 20 ARMAS
const guns=[
 {n:"Pistola",d:15,s:1100,r:.32,c:"#ffe08b",k:90,type:"bullet"},
 {n:"Revólver",d:27,s:1250,r:.55,c:"#ffca7b",k:150,type:"bullet"},
 {n:"Desert Eagle",d:38,s:1350,r:.7,c:"#ffdb78",k:210,type:"bullet"},
 {n:"Escopeta",d:9,s:950,r:.8,c:"#ff9c58",k:230,p:8,type:"pellet"},
 {n:"Escopeta dupla",d:11,s:1000,r:1,c:"#ff8a50",k:300,p:12,type:"pellet"},
 {n:"SMG",d:7,s:1250,r:.085,c:"#ffe68d",k:55,type:"bullet"},
 {n:"MP5",d:8,s:1300,r:.11,c:"#ffe68d",k:65,type:"bullet"},
 {n:"Vector",d:6,s:1350,r:.065,c:"#ffe68d",k:50,type:"bullet"},
 {n:"Rifle",d:12,s:1500,r:.18,c:"#f9d77d",k:120,type:"bullet"},
 {n:"AK-47",d:14,s:1450,r:.2,c:"#f9d77d",k:150,type:"bullet"},
 {n:"M4",d:11,s:1600,r:.13,c:"#f9d77d",k:110,type:"bullet"},
 {n:"Fuzil pesado",d:20,s:1350,r:.35,c:"#ffb26b",k:240,type:"bullet"},
 {n:"Sniper",d:70,s:2100,r:1.2,c:"#c9edff",k:400,type:"sniper"},
 {n:"DMR",d:28,s:1750,r:.48,c:"#c9edff",k:230,type:"bullet"},
 {n:"Lança-chamas",d:5,s:650,r:.045,c:"#ff743a",k:35,type:"fire"},
 {n:"Lançador",d:48,s:650,r:1.2,c:"#ff8c52",k:500,type:"rocket"},
 {n:"Granada",d:55,s:500,r:1.1,c:"#a6e881",k:450,type:"grenade"},
 {n:"Laser",d:32,s:2200,r:.5,c:"#50eaff",k:100,type:"laser"},
 {n:"Plasma",d:26,s:1050,r:.35,c:"#c478ff",k:180,type:"plasma"},
 {n:"Canhão",d:85,s:1000,r:1.8,c:"#ff5b9c",k:700,type:"cannon"}
];

let player={x:350,y:400,vx:0,vy:0,hp:100,face:1,ground:false,gun:0,cool:0};
let enemy={x:1050,y:400,vx:0,vy:0,hp:100,face:-1,gun:0};
let camera=0,active=false,online=false,enemySeen=false;
let bullets=[],particles=[],explosions=[],pickups=[],grenades=[];
let last=performance.now(),dropTimer=0,sendTimer=0;

const world={width:3000,floor:650};

const platforms=[
 [0,650,3000,250],
 [180,500,300,20],[600,420,250,20],
 [1000,510,300,20],[1400,400,280,20],
 [1850,500,300,20],[2300,420,300,20],
 [380,300,170,18],[1250,270,200,18],[2100,290,200,18]
];

let props=[];
for(let x=120;x<2900;x+=270){
 props.push({x,y:590,w:55,h:60,kind:x%2?"crate":"barrel"});
}

const input={move:0,jump:false,fire:false,special:false};

function buttonControl(id,key){
 const el=$(id);
 el.onpointerdown=e=>{
  e.preventDefault();input[key]=true;
  el.setPointerCapture(e.pointerId);
 };
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  el.addEventListener(ev,()=>input[key]=false)
 );
}
buttonControl("jump","jump");
buttonControl("shoot","fire");
buttonControl("special","special");

const stick=$("stick"),knob=$("knob");
let joy=null;
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const len=Math.hypot(x,y),max=45;
 if(len>max){x=x/len*max;y=y/len*max;}
 input.move=x/max;
 knob.style.left=`calc(50% + ${x}px)`;
 knob.style.top=`calc(50% + ${y}px)`;
}
stick.onpointerdown=e=>{joy=e.pointerId;stick.setPointerCapture(joy);moveJoy(e)};
stick.onpointermove=e=>{if(e.pointerId===joy)moveJoy(e)};
function endJoy(){
 joy=null;input.move=0;knob.style.left="50%";knob.style.top="50%";
}
stick.onpointerup=endJoy;stick.onpointercancel=endJoy;

addEventListener("keydown",e=>{
 if(e.key==="a"||e.key==="ArrowLeft")input.move=-1;
 if(e.key==="d"||e.key==="ArrowRight")input.move=1;
 if(e.key===" "||e.key==="ArrowUp")input.jump=true;
 if(e.key==="j")input.fire=true;
 if(e.key==="k")input.special=true;
});
addEventListener("keyup",e=>{
 if(["a","d","ArrowLeft","ArrowRight"].includes(e.key))input.move=0;
 if(e.key===" "||e.key==="ArrowUp")input.jump=false;
 if(e.key==="j")input.fire=false;
 if(e.key==="k")input.special=false;
});

// MENU DE ARMAS
guns.forEach((g,i)=>{
 const b=document.createElement("button");
 b.textContent=(i+1)+" "+g.n;
 b.onclick=()=>player.gun=i;
 $("weapons").appendChild(b);
});

function start(){
 active=true;
 $("menu").style.display="none";
 $("hud").style.display="block";
 $("controls").style.display="block";
 $("weapons").style.display="flex";
}

$("solo").onclick=()=>{
 online=false;
 enemySeen=true;
 enemy.x=player.x+700;
 start();
};

$("create").onclick=async()=>{
 if(!db||!uid)return $("status").textContent="Aguarde o Firebase conectar.";
 const code=String(Math.floor(100000+Math.random()*900000));
 await joinRoom(code,true);
};

$("join").onclick=async()=>{
 const code=$("roomcode").value.trim();
 if(!/^\d{6}$/.test(code))return $("status").textContent="Digite seis números.";
 if(!db||!uid)return $("status").textContent="Aguarde o Firebase conectar.";
 await joinRoom(code,false);
};

async function joinRoom(code,host){
 try{
  room=db.ref("rooms/"+code);
  const snap=await room.once("value");
  if(host&&snap.exists())return $("status").textContent="Tente criar outra sala.";
  if(!host&&!snap.exists())return $("status").textContent="Sala não encontrada.";

  if(host)await room.set({players:{},shots:{}});

  const players=(await room.child("players").once("value")).val()||{};
  if(Object.keys(players).length>=2&&!players[uid])
   return $("status").textContent="Sala cheia.";

  player.x=host?350:2650;
  player.face=host?1:-1;
  playerRef=room.child("players/"+uid);
  await playerRef.set({
   x:player.x,y:player.y,hp:100,face:player.face,gun:0
  });
  playerRef.onDisconnect().remove();

  room.child("players").on("value",s=>{
   const all=s.val()||{};
   const other=Object.entries(all).find(([id])=>id!==uid);
   if(other){
    enemySeen=true;
    const p=other[1];
    enemy.x=p.x;enemy.y=p.y;enemy.hp=p.hp;
    enemy.face=p.face;enemy.gun=p.gun||0;
   }
  });

  room.child("shots").on("child_added",s=>{
   const b=s.val();
   if(b&&b.owner!==uid){
    bullets.push({...b,remote:true,life:1});
   }
  });

  online=true;
  $("roomlabel").textContent="Sala "+code;
  start();
 }catch(e){
  $("status").textContent="Erro: "+e.message;
 }
}

function sync(){
 if(!playerRef)return;
 playerRef.update({
  x:player.x,y:player.y,hp:player.hp,
  face:player.face,gun:player.gun
 }).catch(()=>{});
}

function sendShot(b){
 if(!room||performance.now()-sendTimer<35)return;
 sendTimer=performance.now();
 const ref=room.child("shots").push();
 ref.set({...b,owner:uid});
 setTimeout(()=>ref.remove().catch(()=>{}),1500);
}

function burst(x,y,color,count=18){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const s=100+Math.random()*500;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:.3+Math.random()*.5,color
  });
 }
}

function shoot(special=false){
 const g=guns[player.gun];
 if(player.cool>0)return;
 player.cool=g.r;

 player.vx-=player.face*g.k*.25;
 const count=g.p||1;

 for(let i=0;i<count;i++){
  const spread=count>1?(Math.random()-.5)*.42:0;
  const angle=spread;
  const b={
   x:player.x+player.face*35,y:player.y+15,
   vx:Math.cos(angle)*g.s*player.face,
   vy:Math.sin(angle)*g.s,
   damage:g.d*(special?1.5:1),
   color:g.c,life:1.7,owner:uid,
   type:g.type,radius:g.type==="rocket"||g.type==="cannon"?9:4
  };
  bullets.push(b);
  if(!b.remote)sendShot(b);
 }

 burst(player.x+player.face*35,player.y+15,g.c,7);

 if(g.type==="grenade"){
  grenades.push({
   x:player.x+player.face*30,y:player.y,
   vx:player.face*480,vy:-450,fuse:1.3,owner:uid
  });
 }
}

function explode(x,y,damage,owner){
 explosions.push({x,y,r:10,max:130,life:.45});
 burst(x,y,"#ff9c4b",50);
 if(owner===uid&&enemySeen&&Math.hypot(enemy.x-x,enemy.y-y)<150){
  hitEnemy(damage);
 }
}

function hitEnemy(damage){
 if(!enemySeen)return;
 if(online&&room){
  room.child("players").once("value").then(s=>{
   const all=s.val()||{};
   const id=Object.keys(all).find(k=>k!==uid);
   if(id){
    room.child("players/"+id).transaction(p=>{
     if(p)p.hp=Math.max(0,(p.hp??100)-damage);
     return p;
    });
   }
  });
 }else{
  enemy.hp=Math.max(0,enemy.hp-damage);
 }
}

function update(dt){
 if(!active)return;

 const oldY=player.y;
 player.vx+=input.move*1900*dt;
 if(Math.abs(input.move)>.1)player.face=Math.sign(input.move);
 player.vx*=Math.pow(player.ground?.82:.99,dt*60);
 player.vx=Math.max(-650,Math.min(650,player.vx));

 if(input.jump&&player.ground){
  player.vy=-820;player.ground=false;
 }
 player.vy=Math.min(1400,player.vy+1900*dt);
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.x=Math.max(25,Math.min(world.width-25,player.x));

 player.ground=false;
 for(const p of platforms){
  if(player.x+18>p[0]&&player.x-18<p[0]+p[2]&&
     player.y+65>p[1]&&oldY+65<=p[1]+12&&player.vy>=0){
   player.y=p[1]-65;player.vy=0;player.ground=true;
  }
 }

 for(const o of props){
  if(player.x+18>o.x&&player.x-18<o.x+o.w&&
     player.y+65>o.y&&oldY+65<=o.y+12&&player.vy>=0){
   player.y=o.y-65;player.vy=0;player.ground=true;
  }
 }

 if(player.y>1000){
  player.y=350;player.vy=0;player.hp-=10;
 }

 player.cool=Math.max(0,player.cool-dt);
 if(input.fire)shoot();
 if(input.special)shoot(true);

 if(!online&&enemySeen){
  enemy.vy+=1500*dt;
  enemy.y+=enemy.vy*dt;
  if(enemy.y>world.floor-65){enemy.y=world.floor-65;enemy.vy=0;}
  enemy.x+=Math.sin(performance.now()/1000)*40*dt;
 }

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;

  if(b.type==="rocket"||b.type==="cannon"||b.type==="plasma"){
   particles.push({x:b.x,y:b.y,vx:0,vy:0,life:.18,color:b.color});
  }

  if(b.owner===uid&&enemySeen&&
    Math.abs(b.x-enemy.x)<28&&Math.abs(b.y-enemy.y-20)<50){
   if(online)hitEnemy(b.damage);
   else enemy.hp=Math.max(0,enemy.hp-b.damage);
   burst(b.x,b.y,b.color,20);
   bullets.splice(i,1);continue;
  }

  if(b.type==="rocket"&&b.life<1.4&&b.life>0){
   // O foguete deixa um rastro de partículas.
  }

  if(b.life<=0||b.x<0||b.x>world.width||b.y>900){
   if(["rocket","cannon"].includes(b.type))
    explode(b.x,b.y,b.damage,b.owner);
   bullets.splice(i,1);
  }
 }

 for(let i=grenades.length-1;i>=0;i--){
  const g=grenades[i];
  g.vy+=1300*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.fuse-=dt;
  if(g.y>world.floor-10){g.y=world.floor-10;g.vy*=-.5;g.vx*=.75;}
  if(g.fuse<=0){
   explode(g.x,g.y,55,g.owner);
   grenades.splice(i,1);
  }
 }

 particles.forEach(p=>{
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=650*dt;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);

 explosions.forEach(e=>{e.r+=(e.max-e.r)*.2;e.life-=dt});
 explosions=explosions.filter(e=>e.life>0);

 dropTimer+=dt;
 if(dropTimer>7){
  dropTimer=0;
  pickups.push({
   x:camera+W*.5+(Math.random()-.5)*W*.7,
   y:90,vy:0,gun:Math.floor(Math.random()*guns.length)
  });
 }

 for(let i=pickups.length-1;i>=0;i--){
  const p=pickups[i];
  p.vy+=1300*dt;p.y+=p.vy*dt;
  if(p.y>world.floor-30){p.y=world.floor-30;p.vy=0;}
  if(Math.hypot(p.x-player.x,p.y-player.y)<45){
   player.gun=p.gun;
   pickups.splice(i,1);
  }
 }

 camera=Math.max(0,Math.min(world.width-W,player.x-W*.42));
 $("hp1").style.width=Math.max(0,player.hp)+"%";
 $("hp2").style.width=Math.max(0,enemy.hp)+"%";

 if(online&&performance.now()-sendTimer>100){
  sync();
 }
}

// CENÁRIO
function background(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#f4a84f");
 sky.addColorStop(.65,"#a85d3e");
 sky.addColorStop(1,"#342c35");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // Sol
 ctx.fillStyle="#ffd27a";
 ctx.beginPath();ctx.arc(W*.75,H*.25,75,0,7);ctx.fill();

 // Prédios distantes
 ctx.save();ctx.translate(-camera*.25,0);
 for(let x=0;x<4000;x+=270){
  const h=130+(x%5)*25;
  ctx.fillStyle="#493b43";
  ctx.fillRect(x,H*.72-h,230,h);
  for(let wx=15;wx<210;wx+=45){
   for(let wy=20;wy<h-15;wy+=40){
    ctx.fillStyle="#e6a65b";
    ctx.fillRect(x+wx,H*.72-h+wy,22,25);
   }
  }
 }
 ctx.restore();
}

function city(){
 ctx.save();ctx.translate(-camera,0);

 // Chão
 ctx.fillStyle="#403b3e";
 ctx.fillRect(0,world.floor,world.width,300);
 ctx.fillStyle="#a17a59";
 ctx.fillRect(0,world.floor,world.width,7);

 // Plataformas
 for(const p of platforms.slice(1)){
  ctx.fillStyle="#493b3d";
  ctx.fillRect(p[0],p[1],p[2],p[3]);
  ctx.fillStyle="#d09a62";
  ctx.fillRect(p[0],p[1],p[2],5);
 }

 // Prédios
 for(let x=0;x<world.width;x+=650){
  ctx.fillStyle="#593e3b";
  ctx.fillRect(x,world.floor-230,230,230);
  ctx.fillStyle="#ad673d";
  for(let wx=20;wx<210;wx+=55){
   for(let wy=25;wy<210;wy+=55){
    ctx.fillRect(x+wx,world.floor-230+wy,35,40);
   }
  }
  ctx.fillStyle="#2d2932";
  ctx.fillRect(x-5,world.floor-235,240,10);
 }

 // Caixas e barris
 for(const o of props){
  ctx.fillStyle=o.kind==="crate"?"#9a5d35":"#704536";
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle="#d39b62";ctx.lineWidth=4;
  ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);
  if(o.kind==="crate"){
   ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);
   ctx.moveTo(o.x+o.w,o.y);ctx.lineTo(o.x,o.y+o.h);ctx.stroke();
  }
 }

 for(const p of pickups){
  drawGun(p.x,p.y,p.gun,1);
  ctx.fillStyle="#ffe48c";
  ctx.beginPath();ctx.arc(p.x,p.y-17,4,0,7);ctx.fill();
 }

 for(const g of grenades){
  ctx.fillStyle="#83c75b";
  ctx.beginPath();ctx.arc(g.x,g.y,10,0,7);ctx.fill();
 }

 ctx.restore();
}

function drawGun(x,y,index,face){
 const g=guns[index];
 ctx.save();ctx.translate(x,y);ctx.scale(face,1);
 ctx.fillStyle="#252c35";
 ctx.fillRect(-3,-5,25,10);
 ctx.fillStyle="#68747b";
 ctx.fillRect(12,-8,28,7);
 ctx.fillStyle="#333";
 ctx.fillRect(2,3,9,14);
 ctx.fillStyle=g.c;
 ctx.fillRect(37,-4,5,3);
 if(index===12){
  ctx.fillStyle="#aaa";ctx.fillRect(20,-11,17,3);
 }
 if(index===15||index===19){
  ctx.fillStyle="#252c35";ctx.fillRect(10,-10,22,15);
 }
 if(index===14){
  ctx.fillStyle="#ff7133";ctx.fillRect(17,-10,16,5);
 }
 ctx.restore();
}

function stickman(p,color){
 const x=p.x-camera,y=p.y;
 const run=Math.sin(performance.now()*.018)*Math.min(1,Math.abs(p.vx)/300)*12;
 ctx.save();ctx.translate(x,y);ctx.scale(p.face||1,1);

 ctx.fillStyle="#0006";
 ctx.beginPath();ctx.ellipse(0,66,22,6,0,0,7);ctx.fill();

 ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap="round";
 // Corpo
 ctx.beginPath();ctx.moveTo(0,4);ctx.lineTo(0,37);ctx.stroke();

 // Cabeça
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,-9,12,0,7);ctx.fill();

 // Braços
 ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(15,20);ctx.lineTo(25,30);ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(-14-run,25);ctx.lineTo(-22-run,34);ctx.stroke();

 // Pernas
 ctx.beginPath();ctx.moveTo(0,37);ctx.lineTo(12+run,51);ctx.lineTo(15+run,65);ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,37);ctx.lineTo(-12-run,51);ctx.lineTo(-16-run,65);ctx.stroke();

 // Arma na mão
 drawGun(24,20,p.gun||0,1);
 ctx.restore();
}

function effects(){
 ctx.save();ctx.translate(-camera,0);

 for(const b of bullets){
  ctx.strokeStyle=b.color;
  ctx.lineWidth=b.radius||4;
  ctx.shadowBlur=15;ctx.shadowColor=b.color;
  ctx.beginPath();
  ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);
  ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 ctx.shadowBlur=0;

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,3+Math.random()*2,0,7);ctx.fill();
 }

 for(const e of explosions){
  ctx.globalAlpha=Math.min(1,e.life*3);
  ctx.fillStyle="#ffbd51";
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
  ctx.fillStyle="#34313a";
  ctx.beginPath();ctx.arc(e.x,e.y,e.r*.72,0,7);ctx.fill();
  ctx.fillStyle="#ff813e";
  ctx.beginPath();ctx.arc(e.x,e.y,e.r*.4,0,7);ctx.fill();
 }

 ctx.restore();ctx.globalAlpha=1;
}

function render(){
 background();
 city();
 stickman(player,"#f2f0e8");
 if(enemySeen)stickman(enemy,"#59e5e1");
 effects();

 // Nome da arma equipada
 if(active){
  ctx.fillStyle="#fff";
  ctx.font="bold 14px Arial";
  ctx.textAlign="center";
  ctx.fillText(guns[player.gun].n,W/2,H-18);
 }
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000||0);
 last=now;
 update(dt);
 render();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

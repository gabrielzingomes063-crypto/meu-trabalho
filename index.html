
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#241b25;font-family:Arial;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#39232b,#17151d);color:white}
h1{font-size:clamp(35px,8vw,65px);color:#ffca68;text-shadow:4px 4px #5a2521}
button{border:2px solid #fff8;border-radius:13px;background:#bd563b;color:white;font-weight:bold;font-size:18px;padding:15px 22px;cursor:pointer}
#menu button{width:min(330px,85vw)}
input{padding:14px;border-radius:10px;border:0;font-size:18px;text-align:center;width:min(330px,85vw)}
#status{font-size:13px;color:#ffd18c;text-align:center}
#hud{display:none;position:fixed;top:10px;left:12px;right:12px;color:white;text-shadow:2px 2px #21151b;font-weight:bold;justify-content:space-between;pointer-events:none}
#exit{display:none;position:fixed;top:10px;right:10px;padding:10px 16px;z-index:3;font-size:14px}
#controls{display:none;position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;align-items:end;pointer-events:auto}
.ctrl{width:72px;height:72px;border-radius:50%;background:#282a38dd;border:3px solid #ffffffaa;color:white;font-size:27px;padding:0;touch-action:none}
#fire{width:84px;height:84px;background:#c83232e8;font-size:17px}
#jump{background:#285dcbe8}
#hint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);color:white;text-shadow:2px 2px #000;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <h1>STICKMAN BATTLE</h1>
  <p>Uma batalha de física e destruição!</p>
  <button onclick="startGame(false)">JOGAR SOZINHO</button>
  <button onclick="createRoom()">CRIAR SALA ONLINE</button>
  <input id="roomCode" maxlength="6" placeholder="CÓDIGO DA SALA">
  <button onclick="joinRoom()">ENTRAR NA SALA</button>
  <div id="status">Inicializando...</div>
</div>

<div id="hud">
  <span id="life">VIDA: 100</span>
  <span id="weaponLabel">ARMA: NENHUMA</span>
  <span id="roomLabel"></span>
</div>
<button id="exit" onclick="backMenu()">SAIR</button>
<div id="hint">WASD ou setas para mover • Espaço para pular • J para atirar</div>
<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="jump">↑</button>
    <button class="ctrl" id="fire">ATIRAR</button>
  </div>
</div>

 online=isOnline;

 player.health=100;player.weapon=null;player.rag=false;
 bullets=[];particles=[];weapons=[];debris=[];camera=0;dropClock=0;
 for(let i=0;i<8;i++)dropWeapon();

 document.getElementById("menu").style.display="none";

 document.getElementById("controls").style.display="flex";
 document.getElementById("exit").style.display="block";
 document.getElementById("hint").style.display="block";

function backMenu(){
 running=false;
 if(room&&uid)room.child("players/"+uid).remove();

 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";

}
function startGameSolo(){startGame(false)}

}
</script>
</body>
</html>

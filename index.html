
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160b19;font-family:Arial;color:white}
canvas{width:100vw;height:100dvh;display:block;touch-action:none}

#menu{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#160b1eee}
.panel{width:min(380px,90vw);padding:25px;background:#281426;border:1px solid #a44d31;border-radius:15px;text-align:center}
h1{color:#ff9b40}
input{width:100%;padding:13px;margin:7px 0;background:#160d19;border:1px solid #74422f;border-radius:8px;color:white;text-align:center}
button{border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.main,.secondary{width:100%;padding:13px;margin:6px 0;border-radius:8px;font-weight:bold}
.main{background:#ff8a35;color:#25101a}
.secondary{background:#493044;color:white}
#status{font-size:12px;color:#ffbd7a;min-height:18px;margin-top:8px}

#hud{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(600px,85vw);justify-content:space-between;pointer-events:none}
.playerhud{width:44%;text-align:center}
.name{font-size:11px;margin-bottom:4px;text-shadow:0 2px 5px black}
.bar{height:13px;background:#21111c;border:1px solid #ffbd77;border-radius:10px;overflow:hidden}
.health{height:100%;background:linear-gradient(90deg,#e43b25,#ffc04a);width:100%}
#roomLabel,#weaponLabel{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;text-shadow:0 2px 5px black;display:none}
#roomLabel{top:47px;color:#ffd3a1}
#weaponLabel{top:67px;color:#ffe18d}
#message{display:none;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:#ffc36c;text-shadow:0 3px 10px black}
#exit{display:none;position:absolute;top:10px;right:10px;padding:9px 13px;border-radius:8px;background:#392034;color:white}

#controls{display:none;position:absolute;inset:0;pointer-events:none}
#movement{position:absolute;left:5%;bottom:7%;display:flex;align-items:center;gap:25px;pointer-events:auto}
#actions{position:absolute;right:5%;bottom:7%;display:flex;align-items:center;gap:18px;pointer-events:auto}
.ctrl{width:65px;height:65px;border-radius:20px;color:white;font-size:25px;background:linear-gradient(145deg,#56334b,#211322);border:1px solid #f2a35e;box-shadow:0 5px 0 #140b17,0 0 15px #ff873333}
.ctrl:active{transform:translateY(3px)}
.jump{background:linear-gradient(145deg,#267d91,#173b55)}
.attack{width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,#e75c34,#77202b);font-size:27px}
.special{width:65px;height:65px;border-radius:50%;background:linear-gradient(145deg,#6254d8,#25206e)}
#rotate{display:none;position:absolute;inset:0;z-index:30;background:#160b1b;align-items:center;justify-content:center;text-align:center}
@media(orientation:portrait){#rotate{display:flex}}
@media(max-height:450px){
 #movement,#actions{bottom:5%}
 .ctrl{width:55px;height:55px}
 .attack{width:65px;height:65px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="rotate">
 <div><div style="font-size:60px">📱 ↻</div><h2>GIRE A TELA</h2><p>Jogue com o celular na horizontal.</p></div>
</div>

<div id="menu">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <p>PHYSICS WEAPON ARENA</p>
  <button class="main" onclick="createRoom()">CRIAR PARTIDA</button>
  <input id="roomInput" maxlength="6" placeholder="CÓDIGO DA SALA">
  <button class="secondary" onclick="joinRoom()">ENTRAR NA PARTIDA</button>
  <div id="status">Conectando...</div>
 </div>
</div>

<div id="hud">
 <div class="playerhud"><div class="name">JOGADOR 1</div><div class="bar"><div id="hp1" class="health"></div></div></div>
 <div class="playerhud"><div class="name">JOGADOR 2</div><div class="bar"><div id="hp2" class="health"></div></div></div>
</div>

<div id="roomLabel"></div>
<div id="weaponLabel"></div>
<div id="message"></div>
<button id="exit" onclick="leaveGame()">SAIR</button>

<div id="controls">
 <div id="movement">
  <button class="ctrl" data-key="left">◀</button>
  <button class="ctrl" data-key="right">▶</button>
  <button class="ctrl jump" data-key="jump">⬆</button>
 </div>
 <div id="actions">
  <button class="ctrl special" data-key="special">✦</button>
  <button class="ctrl attack" data-key="attack">⚔</button>
 </div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73",
 measurementId:"G-4ZZY2234EY"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");

let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
addEventListener("resize",resize);resize();

let uid=null,roomId=null,roomRef=null,slot=1;
let playing=false,enemy=null,weapon=null;
let myHealth=100,enemyHealth=100;
let camera=0,frame=0,gameOver=false;
let lastSync=0,lastAttack=0,lastSpecial=0,lastHit=null;
let particles=[],weaponTimer=null;
let previousAttack=false,previousSpecial=false;

const keys={left:false,right:false,jump:false,attack:false,special:false};

const weaponInfo={
 sword:{name:"ESPADA",damage:18,knock:9,color:"#e9edf5"},
 axe:{name:"MACHADO",damage:25,knock:12,color:"#d9dce3"},
 hammer:{name:"MARTELO",damage:30,knock:16,color:"#c6a9ff"},
 blaster:{name:"BLASTER",damage:22,knock:8,color:"#62eaff"}
};

const platforms=[
 {x:0,y:650,w:4000,h:55},
 {x:100,y:520,w:290,h:17},
 {x:560,y:460,w:230,h:17},
 {x:930,y:535,w:300,h:17},
 {x:1450,y:455,w:240,h:17},
 {x:2200,y:520,w:300,h:17},
 {x:2750,y:465,w:250,h:17},
 {x:3300,y:530,w:300,h:17}
];
const tower={x:1900,y:320,w:170,h:330};

let p={};

function resetPlayer(){
 p={
  x:slot===1?500:2400,y:250,vx:0,vy:0,
  facing:slot===1?1:-1,ground:false,
  walk:0,attack:false,weapon:null,
  invulnerable:0
 };
}

auth.signInAnonymously().then(r=>{
 uid=r.user.uid;
 status("Conectado! Crie ou entre em uma sala.");
}).catch(e=>status("Erro de conexão: "+e.message));

function status(t){document.getElementById("status").textContent=t}
function randomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}

async function createRoom(){
 if(!uid)return status("Aguarde a conexão...");
 roomId=randomCode();slot=1;roomRef=db.ref("rooms/"+roomId);
 try{
  await roomRef.set({
   type:"stickfight",status:"waiting",
   players:{[uid]:{x:500,y:250,hp:100,ready:true}},
   weapon:{active:false,nextAt:Date.now()+30000}
  });
  enterGame();
 }catch(e){status(e.message)}
}

async function joinRoom(){
 if(!uid)return status("Aguarde a conexão...");
 const code=document.getElementById("roomInput").value.trim().toUpperCase();
 if(code.length!==6)return status("Digite o código de 6 caracteres.");
 roomRef=db.ref("rooms/"+code);
 try{
  const snap=await roomRef.get();
  if(!snap.exists())return status("Sala não encontrada.");
  const data=snap.val();
  if(data.type!=="stickfight")return status("Sala incompatível.");
  if(Object.keys(data.players||{}).length>=2)return status("Sala cheia.");
  roomId=code;slot=2;
  await roomRef.child("players/"+uid).set({x:2400,y:250,hp:100,ready:true});
  await roomRef.child("status").set("playing");
  enterGame();
 }catch(e){status(e.message)}
}

function enterGame(){
 playing=true;gameOver=false;myHealth=100;enemyHealth=100;
 resetPlayer();
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("controls").style.display="block";
 document.getElementById("exit").style.display="block";
 document.getElementById("roomLabel").style.display="block";
 document.getElementById("roomLabel").textContent="SALA: "+roomId;
 listenRoom();
 startWeaponTimer();
}

function listenRoom(){
 roomRef.child("players").on("value",snap=>{
  const list=snap.val()||{};
  const other=Object.entries(list).find(([id])=>id!==uid);
  enemy=other?{id:other[0],...other[1]}:null;
  enemyHealth=enemy?.hp??100;
  updateHud();
 });
 roomRef.child("weapon").on("value",snap=>{
  weapon=snap.val()||null;
 });
}

function startWeaponTimer(){
 if(weaponTimer)clearInterval(weaponTimer);
 if(slot!==1)return;

 weaponTimer=setInterval(async()=>{
  if(!playing||!roomRef)return;
  try{
   const ref=roomRef.child("weapon");
   const snap=await ref.get();
   const current=snap.val()||{};
   if(!current.active&&Date.now()>=Number(current.nextAt||0)){
    const types=Object.keys(weaponInfo);
    const type=types[Math.floor(Math.random()*types.length)];
    const x=200+Math.random()*3500;
    await ref.set({
     active:true,type,x,y:70,vy:0,
     nextAt:Date.now()+30000,
     id:Date.now()
    });
   }
  }catch(e){}
 },500);
}

function updateHud(){
 document.getElementById("hp1").style.width=Math.max(0,myHealth)+"%";
 document.getElementById("hp2").style.width=Math.max(0,enemyHealth)+"%";
}

function showWeaponMessage(text){
 const el=document.getElementById("weaponLabel");
 el.textContent=text;el.style.display="block";
 setTimeout(()=>el.style.display="none",1800);
}

function leaveGame(){
 playing=false;
 if(weaponTimer)clearInterval(weaponTimer);
 if(roomRef){
  roomRef.child("players/"+uid).remove().catch(()=>{});
  roomRef.child("players").off();
  roomRef.child("weapon").off();
 }
 document.getElementById("menu").style.display="flex";
 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";
 document.getElementById("exit").style.display="none";
 document.getElementById("roomLabel").style.display="none";
 document.getElementById("weaponLabel").style.display="none";
 document.getElementById("message").style.display="none";
 status("Você saiu da partida.");
}

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=true;
 if(e.key==="d"||e.key==="ArrowRight")keys.right=true;
 if(e.key==="w"||e.key==="ArrowUp"||e.key===" ")keys.jump=true;
 if(e.key==="j")keys.attack=true;
 if(e.key==="k")keys.special=true;
});
addEventListener("keyup",e=>{
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=false;
 if(e.key==="d"||e.key==="ArrowRight")keys.right=false;
 if(e.key==="w"||e.key==="ArrowUp"||e.key===" ")keys.jump=false;
 if(e.key==="j")keys.attack=false;
 if(e.key==="k")keys.special=false;
});

document.querySelectorAll(".ctrl").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
  if(b.setPointerCapture)b.setPointerCapture(e.pointerId);
 });
 for(const ev of ["pointerup","pointercancel","lostpointercapture"])
  b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false});
});

function burst(x,y,color,count=20){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,s=1+Math.random()*6;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:25+Math.random()*20,color,size:2+Math.random()*4
  });
 }
}

function takeDamage(damage,knock){
 if(p.invulnerable>0)return;
 myHealth=Math.max(0,myHealth-damage);
 p.vx+=knock;p.vy=-5;p.invulnerable=20;
 burst(p.x,p.y-20,"#ff5939",15);
 updateHud();checkEnd();
}

function damageEnemy(damage,knock){
 if(!enemy||!roomRef)return;
 roomRef.child("players/"+enemy.id).transaction(v=>{
  if(!v)return v;
  v.hp=Math.max(0,(v.hp??100)-damage);
  v.knock=knock;
  v.hitId=Date.now()+"_"+Math.random();
  return v;
 });
}

function normalAttack(){
 if(Date.now()-lastAttack<450)return;
 lastAttack=Date.now();
 p.attack=true;
 setTimeout(()=>p.attack=false,220);

 const info=p.weapon?weaponInfo[p.weapon]:{damage:8,knock:5};
 if(enemy){
  const dx=enemy.x-p.x,dy=Math.abs(enemy.y-p.y);
  if(Math.abs(dx)<(p.weapon?130:75)&&dy<90&&dx*p.facing>0){
   damageEnemy(info.damage,p.facing*info.knock);
   burst(p.x+p.facing*45,p.y-20,info.color||"#ffd06b",12);
  }
 }
}

function specialAttack(){
 if(Date.now()-lastSpecial<1800)return;
 lastSpecial=Date.now();
 if(!p.weapon){
  showWeaponMessage("PEGUE UMA ARMA PRIMEIRO!");
  return;
 }
 const info=weaponInfo[p.weapon];
 damageEnemy(info.damage+10,p.facing*(info.knock+5));
 burst(p.x+p.facing*60,p.y-20,info.color,35);
 showWeaponMessage("ATAQUE ESPECIAL!");
}

function receiveHits(){
 if(!enemy||!enemy.hitId||enemy.hitId===lastHit)return;
 lastHit=enemy.hitId;
 takeDamage(10,Number(enemy.knock)||-5);
}

function update(){
 if(!playing||gameOver)return;
 frame++;

 // Movimento e aceleração
 if(keys.left){p.vx-=.75;p.facing=-1}
 if(keys.right){p.vx+=.75;p.facing=1}
 p.vx*=p.ground?.82:.94;
 p.vx=Math.max(-8,Math.min(8,p.vx));

 // Pulo
 if(keys.jump&&p.ground){p.vy=-14;p.ground=false}
 // Gravidade
 p.vy=Math.min(17,p.vy+.58);

 // Integração de movimento
 p.x+=p.vx;
 p.y+=p.vy;
 p.ground=false;

 // Colisão com plataformas
 for(const a of platforms){
  if(p.x+14>a.x&&p.x-14<a.x+a.w&&
     p.y+40>=a.y&&p.y+40<=a.y+25&&p.vy>=0){
   p.y=a.y-40;p.vy=0;p.ground=true;
  }
 }

 // Colisão com torre
 if(p.x+14>tower.x&&p.x-14<tower.x+tower.w&&
    p.y+40>tower.y&&p.y<tower.y+tower.h){
  p.x=p.x<tower.x+tower.w/2?tower.x-15:tower.x+tower.w+15;
  p.vx*=-.2;
 }

 p.x=Math.max(15,Math.min(3985,p.x));
 p.walk+=Math.abs(p.vx)*.12;
 if(p.invulnerable>0)p.invulnerable--;

 // Ataque ao pressionar
 if(keys.attack&&!previousAttack)normalAttack();
 if(keys.special&&!previousSpecial)specialAttack();
 previousAttack=keys.attack;
 previousSpecial=keys.special;

 // Atualização da arma no chão
 if(weapon?.active&&!weapon.holder){
  weapon.vy=Math.min(12,(weapon.vy||0)+.45);
  weapon.y+=weapon.vy;
  for(const a of platforms){
   if(weapon.x>a.x&&weapon.x<a.x+a.w&&
      weapon.y+20>=a.y&&weapon.y+20<=a.y+18&&weapon.vy>0){
    weapon.y=a.y-20;weapon.vy=0;
   }
  }
  // Quem tocar na arma pode pegá-la
  if(Math.abs(p.x-weapon.x)<38&&Math.abs((p.y-5)-weapon.y)<60){
   roomRef.child("weapon").transaction(w=>{
    if(!w||!w.active||w.holder)return;
    return {...w,holder:uid,active:false};
   });
  }
 }

 // Receber empurrão/dano
 receiveHits();

 // Cair fora da arena
 if(p.y>850){p.y=200;p.vy=0;takeDamage(10,0)}

 // Sincronização do jogador
 if(Date.now()-lastSync>65){
  lastSync=Date.now();
  roomRef.child("players/"+uid).update({
   x:p.x,y:p.y,hp:myHealth,
   facing:p.facing,walk:p.walk,attack:p.attack,
   weapon:p.weapon,knock:0
  }).catch(()=>{});
 }

 camera=Math.max(0,Math.min(4000-W,p.x-W*.5));

 for(const q of particles){
  q.x+=q.vx;q.y+=q.vy;q.vy+=.16;q.life--;
 }
 particles=particles.filter(q=>q.life>0);
}

function checkEnd(){
 if(myHealth<=0){gameOver=true;showEnd("VOCÊ PERDEU!")}
 if(enemyHealth<=0){gameOver=true;showEnd("VOCÊ VENCEU!")}
}
function showEnd(t){
 document.getElementById("message").textContent=t;
 document.getElementById("message").style.display="block";
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#351027");
 g.addColorStop(.55,"#83352a");
 g.addColorStop(1,"#d55726");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 for(let layer=0;layer<3;layer++){
  ctx.fillStyle=["#4b1b30","#61232e","#77302b"][layer];
  ctx.beginPath();ctx.moveTo(0,H*.65);
  for(let x=0;x<=W+30;x+=30){
   ctx.lineTo(x,H*(.35+layer*.09)+Math.sin((x+camera*(.08+layer*.06))*.008)*25);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 }
 const glow=ctx.createRadialGradient(W*.5,H*.65,5,W*.5,H*.65,W*.65);
 glow.addColorStop(0,"#ff9b3744");glow.addColorStop(1,"#ff5b1800");
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}

function drawWeapon(type,x,y,angle=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.lineCap="round";ctx.lineJoin="round";
 if(type==="sword"){
  ctx.strokeStyle="#76502d";ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(0,-8);ctx.stroke();
  ctx.strokeStyle="#e4eaf5";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,-49);ctx.stroke();
  ctx.fillStyle="#a9d9f7";
  ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(-5,-44);ctx.lineTo(5,-44);ctx.fill();
  ctx.strokeStyle="#d7a85c";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(10,-7);ctx.stroke();
 }
 if(type==="axe"){
  ctx.strokeStyle="#76502d";ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(0,-30);ctx.stroke();
  ctx.fillStyle="#c7d0d9";
  ctx.beginPath();ctx.moveTo(0,-29);ctx.lineTo(20,-42);ctx.lineTo(22,-17);ctx.lineTo(0,-12);ctx.fill();
 }
 if(type==="hammer"){
  ctx.strokeStyle="#76502d";ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,17);ctx.lineTo(0,-28);ctx.stroke();
  ctx.fillStyle="#aaa6c6";
  ctx.fillRect(-17,-43,34,17);
  ctx.fillStyle="#e2d9f7";ctx.fillRect(-14,-41,28,5);
 }
 if(type==="blaster"){
  ctx.fillStyle="#263a4c";ctx.fillRect(-8,-25,17,35);
  ctx.fillStyle="#57e7ff";ctx.fillRect(-5,-33,11,13);
  ctx.fillStyle="#b6f6ff";ctx.fillRect(-3,-39,6,7);
  ctx.fillStyle="#a4a8b5";ctx.fillRect(-11,-10,23,6);
 }
 ctx.restore();
}

function drawFighter(x,y,color,facing,walk,attacking,equipped){
 ctx.save();ctx.translate(x-camera,y);
 ctx.scale(facing||1,1);
 const step=Math.sin(walk)*.55;
 ctx.lineCap="round";ctx.lineJoin="round";
 ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;
 ctx.shadowColor=color;ctx.shadowBlur=6;

 // Cabeça
 ctx.beginPath();ctx.arc(0,-27,8,0,Math.PI*2);ctx.fill();

 // Corpo inclina com movimento
 const lean=Math.max(-5,Math.min(5,(walk?Math.sin(walk)*3:0)));
 ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(lean,12);ctx.stroke();

 // Braço que segura arma
 ctx.beginPath();ctx.moveTo(0,-12);
 ctx.lineTo(attacking?30:12,-4);ctx.stroke();

 // Outro braço
 ctx.beginPath();ctx.moveTo(0,-12);
 ctx.lineTo(-13+step*6,2);ctx.stroke();

 // Pernas articuladas visualmente
 ctx.beginPath();ctx.moveTo(lean,12);
 ctx.lineTo(-11+step*9,29);
 ctx.lineTo(-14+step*12,40);ctx.stroke();

 ctx.beginPath();ctx.moveTo(lean,12);
 ctx.lineTo(11-step*9,29);
 ctx.lineTo(14-step*12,40);ctx.stroke();

 if(equipped){
  drawWeapon(equipped,attacking?37:17,attacking?-13:-4,attacking?-.9:0);
 }else if(attacking){
  ctx.strokeStyle="#fff1b4";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(24,-10);ctx.lineTo(43,-18);ctx.stroke();
 }
 ctx.restore();
}

function drawArena(){
 ctx.save();ctx.translate(-camera,0);

 // Torre
 ctx.shadowColor="#ff7629";ctx.shadowBlur=20;
 ctx.fillStyle="#54202b";ctx.fillRect(tower.x,tower.y,tower.w,tower.h);
 ctx.shadowBlur=0;
 ctx.fillStyle="#ff842b";
 ctx.fillRect(tower.x-8,tower.y+20,9,105);
 ctx.fillRect(tower.x+tower.w,tower.y+20,9,105);
 ctx.fillStyle="#211327";ctx.fillRect(tower.x,tower.y,tower.w,25);
 for(let y=tower.y+42;y<tower.y+tower.h;y+=43){
  ctx.strokeStyle="#211327";ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(tower.x+8,y+18);ctx.lineTo(tower.x+tower.w-8,y-15);ctx.stroke();
 }

 for(const a of platforms){
  ctx.fillStyle="#301624";ctx.fillRect(a.x,a.y,a.w,a.h+8);
  ctx.fillStyle="#b14c30";ctx.fillRect(a.x,a.y,a.w,4);
  ctx.fillStyle="#1e1120";ctx.fillRect(a.x,a.y+a.h,a.w,5);
 }

 // Arma física no cenário, sem bolinha
 if(weapon?.active&&!weapon.holder){
  drawWeapon(weapon.type,weapon.x,weapon.y,Math.sin(frame*.08)*.12);
  ctx.fillStyle="#fff0b9";ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.fillText(weaponInfo[weapon.type].name,weapon.x,weapon.y-45);
 }
 ctx.restore();
}

function draw(){
 background();
 drawArena();

 if(playing){
  drawFighter(p.x,p.y,p.invulnerable%4?"#fff1a1":"#ffd43b",
   p.facing,p.walk,p.attack,p.weapon);

  if(enemy){
   drawFighter(enemy.x,enemy.y,"#62dff0",
    enemy.facing||-1,enemy.walk||frame*.12,enemy.attack,enemy.weapon);
  }
 }

 for(const q of particles){
  ctx.globalAlpha=Math.max(0,q.life/40);
  ctx.fillStyle=q.color;ctx.shadowColor=q.color;ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(q.x-camera,q.y,q.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#171b27;color:white;font-family:Arial;
 touch-action:none
}
canvas{display:block;width:100%;height:100%}
#menu{

}
.panel{
 width:min(390px,95%);padding:24px;text-align:center;

 box-shadow:0 12px 40px #0009
}
h1{color:#ffcf68;font-size:32px;text-shadow:3px 3px #6e382a}
button,input{
 border:0;border-radius:10px;padding:14px;font-size:15px
}
button{

input{width:100%;margin:8px 0}
#status{font-size:12px;color:#ffd58b;min-height:18px}
#hud{

}
.health{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px}
.bar{width:90px;height:10px;background:#612e35;border-radius:8px;overflow:hidden}
.fill{height:100%;width:100%;background:#62df80}
#weaponInfo{font-size:12px;color:#ffe3a0;margin-top:5px}
#controls{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
#stick{
 position:absolute;left:20px;bottom:20px;width:125px;height:125px;

}
#knob{
 position:absolute;width:52px;height:52px;left:50%;top:50%;
 transform:translate(-50%,-50%);border-radius:50%;background:#eee
}
.ctrl{

 background:#ffffff40;border:2px solid #ffffffa0;

}
#jump{right:20px;bottom:20px;width:75px;height:75px;background:#3284d4}
#shoot{right:105px;bottom:24px;width:82px;height:82px;background:#d94335}
#special{right:30px;bottom:112px;width:62px;height:62px;background:#9b54c7;font-size:11px}
@media(max-width:600px){
 .panel{padding:17px}
 h1{font-size:26px}
 #stick{width:110px;height:110px;left:12px;bottom:12px}
 #knob{width:47px;height:47px}
 #jump{right:12px;bottom:12px;width:65px;height:65px}
 #shoot{right:88px;bottom:16px;width:70px;height:70px}
 #special{right:18px;bottom:95px}
 #hud{width:95%;min-width:0}
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="menu">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <p>Combate • Armas • Física • Explosões</p>
  <button id="solo">JOGAR SOZINHO</button>
  <p style="font-size:12px">MULTIPLAYER ONLINE EXPERIMENTAL</p>
  <button id="create">CRIAR SALA ONLINE</button>
  <input id="roomcode" maxlength="6" inputmode="numeric" placeholder="Código de 6 números">
  <button id="join">ENTRAR NA SALA</button>
  <div id="status">Conectando ao Firebase...</div>
 </div>
</div>

<div id="hud">
 <div class="health">
  <span>VOCÊ</span><div class="bar"><div id="hp1" class="fill"></div></div>
  <span>RIVAL</span><div class="bar"><div id="hp2" class="fill"></div></div>
 </div>
 <div id="weaponInfo">Procure uma arma pelo mapa</div>
 <div id="roomlabel"></div>
</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="shoot" class="ctrl">ATIRAR</div>
 <div id="jump" class="ctrl">↑</div>
 <div id="special" class="ctrl">ESPECIAL</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<script>
"use strict";

/* FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain:"draw-battle-60d94.firebaseapp.com",
 databaseURL:"https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId:"draw-battle-60d94",
 storageBucket:"draw-battle-60d94.firebasestorage.app",
 messagingSenderId:"533481028234",
 appId:"1:533481028234:web:d2fb69123057bcdd3e4b73"
};

const $=id=>document.getElementById(id);
let db=null,uid=null,room=null,playerRef=null;
let online=false,active=false,enemyData=null,enemySeen=false;
try{
 if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
 db=firebase.database();
 firebase.auth().signInAnonymously().then(c=>{
  uid=c.user.uid;
  $("status").textContent="Firebase conectado!";
 }).catch(e=>$("status").textContent="Firebase: "+e.message);
}catch(e){
 $("status").textContent="Firebase indisponível. Modo solo liberado.";
}

/* MATTER PHYSICS */
const Engine=Matter.Engine;
const World=Matter.World;
const Bodies=Matter.Bodies;
const Body=Matter.Body;
const Constraint=Matter.Constraint;
const engine=Engine.create();
engine.gravity.y=1.25;
const physicsWorld=engine.world;

const canvas=$("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,D=1,camera=0;
function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

/* MAPA */
const WORLD_WIDTH=5000,FLOOR=650;
const platforms=[
 [0,650,5000,300],
 [180,500,300,20],[600,420,250,20],[1000,510,300,20],
 [1400,400,280,20],[1850,500,300,20],[2300,420,300,20],
 [2800,510,300,20],[3250,410,300,20],[3800,500,250,20],
 [380,300,170,18],[1250,270,200,18],[2100,290,200,18],
 [3100,280,180,18],[3500,300,220,18],[4050,390,180,18],
 [4550,310,190,18]
];

for(const p of platforms){
 const body=Bodies.rectangle(
  p[0]+p[2]/2,p[1]+p[3]/2,p[2],p[3],
  {isStatic:true,friction:.9,label:"platform"}
 );
 World.add(physicsWorld,body);
}

/* PERSONAGEM RAGDOLL */
function createRagdoll(x,y,color){
 const parts=[];
 const constraints=[];

 const head=Bodies.circle(x,y-42,12,{
  density:.002,restitution:.15,friction:.6,label:"body"
 });
 const torso=Bodies.rectangle(x,y-8,15,37,{
  density:.004,restitution:.05,friction:.7,label:"body"
 });
 const upperArm1=Bodies.rectangle(x-17,y-12,25,7,{density:.001,label:"body"});
 const lowerArm1=Bodies.rectangle(x-29,y+2,23,6,{density:.001,label:"body"});
 const upperArm2=Bodies.rectangle(x+17,y-12,25,7,{density:.001,label:"body"});
 const lowerArm2=Bodies.rectangle(x+29,y+2,23,6,{density:.001,label:"body"});
 const upperLeg1=Bodies.rectangle(x-8,y+25,8,25,{density:.002,label:"body"});
 const lowerLeg1=Bodies.rectangle(x-10,y+48,7,24,{density:.002,label:"body"});
 const upperLeg2=Bodies.rectangle(x+8,y+25,8,25,{density:.002,label:"body"});
 const lowerLeg2=Bodies.rectangle(x+10,y+48,7,24,{density:.002,label:"body"});

 parts.push(head,torso,upperArm1,lowerArm1,upperArm2,lowerArm2,
 upperLeg1,lowerLeg1,upperLeg2,lowerLeg2);

 function joint(a,b,ax,ay,bx,by,length){
  constraints.push(Constraint.create({
   bodyA:a,bodyB:b,pointA:{x:ax,y:ay},pointB:{x:bx,y:by},
   length:length,stiffness:.8,damping:.15
  }));
 }
 joint(head,torso,0,12,0,-18,5);
 joint(torso,upperArm1,-5,-12,8,0,5);
 joint(upperArm1,lowerArm1,-9,0,9,0,5);
 joint(torso,upperArm2,5,-12,-8,0,5);
 joint(upperArm2,lowerArm2,9,0,-9,0,5);
 joint(torso,upperLeg1,-5,17,0,-10,5);
 joint(upperLeg1,lowerLeg1,0,10,0,-10,5);
 joint(torso,upperLeg2,5,17,0,-10,5);
 joint(upperLeg2,lowerLeg2,0,10,0,-10,5);

 World.add(physicsWorld,parts);
 World.add(physicsWorld,constraints);

 return {
  parts,head,torso,upperArm1,lowerArm1,upperArm2,lowerArm2,
  upperLeg1,lowerLeg1,upperLeg2,lowerLeg2,
  color,hp:100,gun:-1,ammo:0,cool:0,face:1,
  get x(){return torso.position.x},
  get y(){return torso.position.y}
 };
}

let player=null,enemy=null;

function ragdollImpulse(r,x,y,force){
 for(const part of r.parts){
  const dx=part.position.x-x,dy=part.position.y-y;
  const dist=Math.max(25,Math.hypot(dx,dy));
  if(dist<190){
   const f=force*(1-dist/190)/r.parts.length;
   Body.applyForce(part,part.position,{
    x:dx/dist*f,y:dy/dist*f-.002
   });
  }
 }
}

function damageRagdoll(r,damage){
 r.hp=Math.max(0,r.hp-damage);
 ragdollImpulse(r,r.x,r.y,damage*.0008);
}

/* ARMAS */
const guns=[
 {n:"Pistola",d:15,s:1100,rate:.3,c:"#ffe08b",ammo:24},
 {n:"Revólver",d:27,s:1250,rate:.55,c:"#ffca7b",ammo:12},
 {n:"Desert Eagle",d:38,s:1350,rate:.7,c:"#ffdb78",ammo:8},
 {n:"Escopeta",d:9,s:950,rate:.8,c:"#ff9c58",ammo:24,pellets:8},
 {n:"Escopeta dupla",d:11,s:1000,rate:1,c:"#ff8a50",ammo:12,pellets:12},
 {n:"SMG",d:7,s:1250,rate:.085,c:"#ffe68d",ammo:90},
 {n:"MP5",d:8,s:1300,rate:.11,c:"#ffe68d",ammo:80},
 {n:"Vector",d:6,s:1350,rate:.065,c:"#ffe68d",ammo:100},
 {n:"Rifle",d:12,s:1500,rate:.18,c:"#f9d77d",ammo:60},
 {n:"AK-47",d:14,s:1450,rate:.2,c:"#f9d77d",ammo:45},
 {n:"M4",d:11,s:1600,rate:.13,c:"#f9d77d",ammo:60},
 {n:"Fuzil pesado",d:20,s:1350,rate:.35,c:"#ffb26b",ammo:30},
 {n:"Sniper",d:70,s:2100,rate:1.2,c:"#c9edff",ammo:5},
 {n:"Lança-chamas",d:5,s:650,rate:.045,c:"#ff743a",ammo:100},
 {n:"Lançador",d:48,s:650,rate:1.2,c:"#ff8c52",ammo:5,explosive:true},
 {n:"Granada",d:55,s:500,rate:1.1,c:"#a6e881",ammo:3,grenade:true},
 {n:"Laser",d:32,s:2200,rate:.5,c:"#50eaff",ammo:20},
 {n:"Plasma",d:26,s:1050,rate:.35,c:"#c478ff",ammo:18},
 {n:"Canhão",d:85,s:1000,rate:1.8,c:"#ff5b9c",ammo:3,explosive:true}
];

let bullets=[],pickups=[],particles=[],explosions=[],grenades=[];
let dropTimer=0,fireTimer=0;
const input={move:0,jump:false,fire:false,special:false};

function burst(x,y,color,count=15){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,s=100+Math.random()*500;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:.3+Math.random()*.6,color,
   size:2+Math.random()*4
  });
 }
}

function explode(x,y,damage,owner){
 explosions.push({x,y,r:10,life:.5});
 burst(x,y,"#ffb44e",40);
 burst(x,y,"#55505a",22);
 if(player)ragdollImpulse(player,x,y,.035);
 if(enemy&&enemySeen)ragdollImpulse(enemy,x,y,.035);

 if(player&&Math.hypot(player.x-x,player.y-y)<180)
  damageRagdoll(player,damage*.5);
 if(enemy&&enemySeen&&Math.hypot(enemy.x-x,enemy.y-y)<180)
  damageRagdoll(enemy,damage*.5);
}

/* DISPAROS */
function shoot(special=false){
 if(!player||player.gun<0||player.ammo<=0||player.cool>0)return;
 const g=guns[player.gun];
 player.cool=g.rate;
 player.ammo--;

 const arm=player.upperArm2.position;
 const direction=player.face;
 const count=g.pellets||1;

 for(let i=0;i<count;i++){
  const spread=count>1?(Math.random()-.5)*.55:0;
  const angle=spread;
  bullets.push({
   x:arm.x+direction*20,y:arm.y,
   vx:Math.cos(angle)*g.s*direction,
   vy:Math.sin(angle)*g.s,
   damage:g.d*(special?1.3:1),
   color:g.c,life:1.8,owner:uid,
   explosive:!!g.explosive
  });
 }
 ragdollImpulse(player,arm.x+direction*20,arm.y,-.002);
 burst(arm.x+direction*25,arm.y,g.c,7);
}

/* ARMAS CAINDO */
function spawnWave(){
 for(let i=0;i<2;i++){
  const id=Math.floor(Math.random()*guns.length);
  const x=camera+Math.random()*W;
  const body=Bodies.rectangle(x,50,42,13,{
   density:.002,restitution:.45,friction:.7
  });
  World.add(physicsWorld,body);
  pickups.push({body,gun:id,ammo:guns[id].ammo});
 }
}

function removePickup(p){
 World.remove(physicsWorld,p.body);
 pickups=pickups.filter(x=>x!==p);
}

/* CONTROLES */
function bindButton(id,key){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();input[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  el.addEventListener(ev,()=>input[key]=false)
 );
}
bindButton("jump","jump");
bindButton("shoot","fire");
bindButton("special","special");

const stick=$("stick"),knob=$("knob");
let joy=null;
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const len=Math.hypot(x,y),max=43;
 if(len>max){x=x/len*max;y=y/len*max}
 input.move=x/max;
 knob.style.left=`calc(50% + ${x}px)`;
 knob.style.top=`calc(50% + ${y}px)`;
}
stick.onpointerdown=e=>{
 joy=e.pointerId;stick.setPointerCapture(joy);moveJoy(e);
};
stick.onpointermove=e=>{if(e.pointerId===joy)moveJoy(e)};
function endJoy(){
 joy=null;input.move=0;knob.style.left="50%";knob.style.top="50%";
}
stick.onpointerup=endJoy;
stick.onpointercancel=endJoy;

addEventListener("keydown",e=>{
 if(["a","ArrowLeft"].includes(e.key))input.move=-1;
 if(["d","ArrowRight"].includes(e.key))input.move=1;
 if([" ","ArrowUp","w"].includes(e.key))input.jump=true;
 if(e.key==="j")input.fire=true;
 if(e.key==="k")input.special=true;
});
addEventListener("keyup",e=>{
 if(["a","d","ArrowLeft","ArrowRight"].includes(e.key))input.move=0;
 if([" ","ArrowUp","w"].includes(e.key))input.jump=false;
 if(e.key==="j")input.fire=false;
 if(e.key==="k")input.special=false;
});

/* MULTIPLAYER */
let lastSync=0;
function packPlayer(){
 if(!player)return {};
 return {
  x:player.x,y:player.y,hp:player.hp,face:player.face,
  gun:player.gun,ammo:player.ammo,updated:Date.now()
 };
}
function syncPlayer(){
 if(playerRef)playerRef.update(packPlayer()).catch(()=>{});
}
async function joinRoom(code,host){
 try{
  room=db.ref("rooms/"+code);
  const snap=await room.once("value");
  if(host&&snap.exists()){
   $("status").textContent="Código ocupado. Tente novamente.";return;
  }
  if(!host&&!snap.exists()){
   $("status").textContent="Sala não encontrada.";return;
  }
  if(host)await room.set({players:{},shots:{}});
  const current=(await room.child("players").once("value")).val()||{};
  if(Object.keys(current).length>=2&&!current[uid]){
   $("status").textContent="Sala cheia.";return;
  }
  if(player){
   World.remove(physicsWorld,player.parts);
  }
  player=createRagdoll(host?450:WORLD_WIDTH-450,350,"#f2f0e8");
  player.face=host?1:-1;
  playerRef=room.child("players/"+uid);
  await playerRef.set(packPlayer());
  playerRef.onDisconnect().remove();

  room.child("players").on("value",s=>{
   const all=s.val()||{};
   const other=Object.entries(all).find(([id])=>id!==uid);
   if(other){enemySeen=true;enemyData=other[1]}
   else{enemySeen=false;enemyData=null}
  });
  online=true;
  $("roomlabel").textContent="Sala "+code;
  startGame();
 }catch(e){
  $("status").textContent="Erro: "+e.message;
 }
}

/* INICIAR PARTIDA */
function startGame(){
 active=true;
 $("menu").style.display="none";
 $("hud").style.display="block";
 $("controls").style.display="block";
}
$("solo").onclick=()=>{
 online=false;enemySeen=true;
 player=createRagdoll(500,350,"#f2f0e8");
 enemy=createRagdoll(1100,350,"#59e5e1");
 startGame();
};
$("create").onclick=()=>{
 if(!db||!uid){$("status").textContent="Aguarde o Firebase conectar.";return}
 joinRoom(String(Math.floor(100000+Math.random()*900000)),true);
};
$("join").onclick=()=>{
 const code=$("roomcode").value.trim();
 if(!/^\d{6}$/.test(code)){
  $("status").textContent="Digite um código de seis números.";return;
 }
 if(!db||!uid){$("status").textContent="Aguarde o Firebase conectar.";return}
 joinRoom(code,false);
};

/* ATUALIZAÇÃO */
let last=performance.now();
function update(dt){
 if(!active||!player)return;

 Engine.update(engine,dt*1000);

 // Movimento por impulso
 const speed=input.move;
 if(Math.abs(speed)>.05){
  player.face=Math.sign(speed);
  Body.applyForce(player.torso,player.torso.position,{x:speed*.006,y:0});
 }
 if(input.jump&&player.torso.velocity.y<1){
  Body.applyForce(player.torso,player.torso.position,{x:0,y:-.055});
 }
 if(input.fire)shoot(false);
 if(input.special)shoot(true);
 player.cool=Math.max(0,player.cool-dt);

 // Limites do mapa
 for(const part of player.parts){
  if(part.position.x<15)Body.setPosition(part,{x:15,y:part.position.y});
  if(part.position.x>WORLD_WIDTH-15)
   Body.setPosition(part,{x:WORLD_WIDTH-15,y:part.position.y});
 }

 // Inimigo online
 if(online&&enemyData){
  enemyData.x=Number(enemyData.x)||0;
  if(!enemy){
   enemy=createRagdoll(enemyData.x,enemyData.y||350,"#59e5e1");
  }else{
   const dx=enemyData.x-enemy.x,dy=enemyData.y-enemy.y;
   Body.setPosition(enemy.torso,{
    x:enemy.torso.position.x+dx*.08,
    y:enemy.torso.position.y+dy*.08
   });
   enemy.hp=enemyData.hp??100;
   enemy.face=enemyData.face||-1;
   enemy.gun=enemyData.gun??-1;
  }
 }else if(!online&&enemy){
  const dx=player.x-enemy.x;
  if(Math.abs(dx)>100){
   Body.applyForce(enemy.torso,enemy.torso.position,{
    x:Math.sign(dx)*.002,y:0
   });
  }
  enemy.face=Math.sign(dx)||-1;
  if(Math.random()<.008&&enemy.gun>=0){
   // O boneco rival pode atacar quando estiver armado.
   const a=enemy.upperArm2.position;
   bullets.push({
    x:a.x,y:a.y,vx:enemy.face*950,vy:0,
    damage:8,color:"#59e5e1",life:1,owner:"enemy"
   });
  }
 }

 // Projéteis
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  b.vy+=120*dt;

  const target=b.owner==="enemy"?player:(enemySeen?enemy:null);
  if(target&&Math.hypot(b.x-target.x,b.y-target.y)<30){
   if(b.owner==="enemy")damageRagdoll(player,b.damage);
   else damageRagdoll(target,b.damage);
   burst(b.x,b.y,b.color,12);
   if(b.explosive)explode(b.x,b.y,b.damage,b.owner);
   bullets.splice(i,1);continue;
  }
  if(b.life<=0||b.x<0||b.x>WORLD_WIDTH||b.y>1000){
   if(b.explosive)explode(b.x,b.y,b.damage,b.owner);
   bullets.splice(i,1);
  }
 }

 // Armas no chão
 for(const p of [...pickups]){
  const pos=p.body.position;
  if(Math.hypot(pos.x-player.x,pos.y-player.y)<45){
   player.gun=p.gun;player.ammo=p.ammo;
   burst(pos.x,pos.y,guns[p.gun].c,20);
   removePickup(p);
  }
  if(enemy&&!online&&Math.hypot(pos.x-enemy.x,pos.y-enemy.y)<40){
   enemy.gun=p.gun;enemy.ammo=p.ammo;
   removePickup(p);
  }
 }

 // Granada
 for(let i=grenades.length-1;i>=0;i--){
  const g=grenades[i];
  g.fuse-=dt;
  if(g.fuse<=0){
   explode(g.x,g.y,55,g.owner);grenades.splice(i,1);
  }
 }

 // Partículas
 for(const p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=500*dt;p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);
 for(const e of explosions){e.r+=600*dt;e.life-=dt}
 explosions=explosions.filter(e=>e.life>0);

 // Quedas e renascimento
 if(player.y>1100){
  damageRagdoll(player,10);
  for(const part of player.parts){
   Body.setPosition(part,{x:player.x,y:350});
   Body.setVelocity(part,{x:0,y:0});
  }
 }
 if(enemy&&enemy.y>1100){
  for(const part of enemy.parts){
   Body.setPosition(part,{x:enemy.x,y:350});
   Body.setVelocity(part,{x:0,y:0});
  }
 }

 dropTimer+=dt;
 if(dropTimer>40){dropTimer=0;spawnWave()}

 camera=Math.max(0,Math.min(WORLD_WIDTH-W,player.x-W*.42));

 $("hp1").style.width=player.hp+"%";
 $("hp2").style.width=(enemy?enemy.hp:100)+"%";
 $("weaponInfo").textContent=player.gun<0?
  "Sem arma — procure uma no mapa":
  guns[player.gun].n+" | Munição: "+player.ammo;

 if(online&&performance.now()-lastSync>100){
  lastSync=performance.now();syncPlayer();
 }
}

/* DESENHO */
function drawBackground(){
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#f4a84f");
 grad.addColorStop(.65,"#a85d3e");
 grad.addColorStop(1,"#342c35");
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 ctx.fillStyle="#ffd27a";
 ctx.beginPath();ctx.arc(W*.75,H*.23,65,0,Math.PI*2);ctx.fill();

 ctx.save();ctx.translate(-camera*.25,0);
 for(let x=0;x<6000;x+=270){
  const h=130+(x%5)*25;
  ctx.fillStyle="#493b43";
  ctx.fillRect(x,H*.72-h,230,h);
  for(let wx=15;wx<210;wx+=45){
   for(let wy=20;wy<h-15;wy+=40){
    ctx.fillStyle="#e6a65b";
    ctx.fillRect(x+wx,H*.72-h+wy,22,25);
   }
  }
 }
 ctx.restore();
}

function drawMap(){
 ctx.save();ctx.translate(-camera,0);
 ctx.fillStyle="#403b3e";
 ctx.fillRect(0,FLOOR,WORLD_WIDTH,300);
 ctx.fillStyle="#a17a59";ctx.fillRect(0,FLOOR,WORLD_WIDTH,7);

 for(const p of platforms.slice(1)){
  ctx.fillStyle="#493b3d";ctx.fillRect(p[0],p[1],p[2],p[3]);
  ctx.fillStyle="#d09a62";ctx.fillRect(p[0],p[1],p[2],5);
 }

 for(let x=0;x<WORLD_WIDTH;x+=650){
  ctx.fillStyle="#593e3b";
  ctx.fillRect(x,FLOOR-230,230,230);
  for(let wx=20;wx<210;wx+=55){
   for(let wy=25;wy<210;wy+=55){
    ctx.fillStyle="#ad673d";
    ctx.fillRect(x+wx,FLOOR-230+wy,35,40);
   }
  }
  ctx.fillStyle="#2d2932";ctx.fillRect(x-5,FLOOR-235,240,10);
 }

 for(const p of pickups){
  const pos=p.body.position;
  ctx.save();ctx.translate(pos.x,pos.y);
  ctx.rotate(p.body.angle);
  drawGun(0,0,p.gun);
  ctx.restore();
  ctx.fillStyle="#ffe48c";
  ctx.font="11px Arial";ctx.textAlign="center";
  ctx.fillText(guns[p.gun].n,pos.x,pos.y-20);
 }
 ctx.restore();
}

function drawGun(x,y,index){
 if(index<0)return;
 const g=guns[index];
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#252a32";ctx.strokeStyle="#111820";ctx.lineWidth=2;
 const len=index===12?55:(index===14||index===18?48:38);
 ctx.fillRect(0,-6,len,12);
 ctx.fillStyle="#697781";ctx.fillRect(8,-9,20,3);
 ctx.fillStyle="#795039";
 ctx.fillRect(9,5,8,13);
 ctx.fillStyle=g.c;ctx.fillRect(14,-1,18,3);
 ctx.restore();
}

function drawRagdoll(r){
 if(!r)return;
 ctx.save();ctx.translate(-camera,0);
 const limb="#f2f0e8";

 function line(a,b,color,width){
  ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.lineCap="round";ctx.beginPath();
  ctx.moveTo(a.position.x,a.position.y);
  ctx.lineTo(b.position.x,b.position.y);ctx.stroke();
 }
 line(r.torso,r.upperArm1,limb,6);
 line(r.upperArm1,r.lowerArm1,limb,6);
 line(r.torso,r.upperArm2,limb,6);
 line(r.upperArm2,r.lowerArm2,limb,6);
 line(r.torso,r.upperLeg1,limb,7);
 line(r.upperLeg1,r.lowerLeg1,limb,7);
 line(r.torso,r.upperLeg2,limb,7);
 line(r.upperLeg2,r.lowerLeg2,limb,7);

 ctx.strokeStyle=r.color;ctx.lineWidth=9;
 ctx.beginPath();
 ctx.moveTo(r.torso.position.x,r.torso.position.y-15);
 ctx.lineTo(r.torso.position.x,r.torso.position.y+15);
 ctx.stroke();

 ctx.fillStyle=limb;ctx.beginPath();
 ctx.arc(r.head.position.x,r.head.position.y,12,0,Math.PI*2);
 ctx.fill();ctx.strokeStyle="#252a32";ctx.lineWidth=2;ctx.stroke();

 if(r.gun>=0){
  ctx.save();
  const a=r.lowerArm2.position;
  ctx.translate(a.x,a.y);
  ctx.scale(r.face,1);
  drawGun(0,0,r.gun);
  ctx.restore();
 }
 ctx.restore();
}

function drawEffects(){
 ctx.save();ctx.translate(-camera,0);
 for(const b of bullets){
  ctx.strokeStyle=b.color;ctx.lineWidth=4;
  ctx.shadowBlur=12;ctx.shadowColor=b.color;
  ctx.beginPath();
  ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);
  ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 ctx.shadowBlur=0;
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle=p.color;ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 for(const e of explosions){
  ctx.globalAlpha=Math.max(0,e.life*2);
  ctx.fillStyle="#ffbd51";ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff713e";ctx.beginPath();
  ctx.arc(e.x,e.y,e.r*.55,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();ctx.globalAlpha=1;
}

function render(){
 drawBackground();drawMap();
 drawRagdoll(player);
 if(enemySeen&&enemy)drawRagdoll(enemy);
 drawEffects();
 if(active&&player){
  ctx.fillStyle="white";ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText(player.gun>=0?guns[player.gun].n:"Sem arma",W/2,H-18);
 }
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000||0);
 last=now;
 update(dt);render();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

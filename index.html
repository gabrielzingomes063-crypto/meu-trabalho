
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b27;color:white;font-family:Arial;touch-action:none}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:15px;background:linear-gradient(#171b27dd,#171b27f5)}
.panel{width:min(420px,95%);padding:22px;text-align:center;border-radius:18px;background:#30384a;box-shadow:0 12px 40px #0009}
h1{color:#ffcf68;font-size:32px;text-shadow:3px 3px #6e382a}
button,input{border:0;border-radius:10px;padding:14px;font-size:15px}
button{width:100%;margin:5px 0;background:#e75a40;color:white;font-weight:bold;cursor:pointer}
input{width:100%;margin:8px 0}
#status{font-size:12px;color:#ffd58b;min-height:18px}
#hud{position:fixed;z-index:3;top:8px;left:50%;transform:translateX(-50%);display:none;text-align:center;background:#171b27cc;padding:9px 15px;border-radius:12px;min-width:280px}
.health{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px}
.bar{width:90px;height:10px;background:#612e35;border-radius:8px;overflow:hidden}
.fill{height:100%;width:100%;background:#62df80}
#weaponInfo{font-size:12px;color:#ffe3a0;margin-top:5px}
#roundInfo{font-size:13px;color:#ffcf68;margin-top:4px;font-weight:bold}
#controls{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
#stick{position:absolute;left:20px;bottom:20px;width:125px;height:125px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff77;pointer-events:auto}
#knob{position:absolute;width:52px;height:52px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#eee}
.ctrl{position:absolute;border-radius:50%;display:grid;place-items:center;background:#ffffff40;border:2px solid #ffffffa0;font-weight:bold;pointer-events:auto;user-select:none}
#jump{right:20px;bottom:20px;width:75px;height:75px;background:#3284d4}
#shoot{right:105px;bottom:24px;width:82px;height:82px;background:#d94335}
#special{right:30px;bottom:112px;width:62px;height:62px;background:#9b54c7;font-size:11px}
#drop{right:110px;bottom:115px;width:48px;height:48px;background:#b68b39;font-size:10px}
@media(max-width:600px){
.panel{padding:17px}h1{font-size:26px}
#stick{width:110px;height:110px;left:12px;bottom:12px}
#knob{width:47px;height:47px}
#jump{right:12px;bottom:12px;width:65px;height:65px}
#shoot{right:88px;bottom:16px;width:70px;height:70px}
#special{right:18px;bottom:95px}
#drop{right:100px;bottom:100px}
#hud{width:95%;min-width:0}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
<div class="panel">
<h1>STICKMAN BATTLE</h1>
<p>Combate • Armas • Física • Explosões</p>
<button id="solo">JOGAR SOZINHO</button>
<p style="font-size:12px">MULTIPLAYER ONLINE EXPERIMENTAL</p>
<button id="create">CRIAR SALA ONLINE</button>
<input id="roomcode" maxlength="6" inputmode="numeric" placeholder="Código de 6 números">
<button id="join">ENTRAR NA SALA</button>
<div id="status">Carregando...</div>
</div>
</div>

<div id="hud">
<div class="health">
<span>VOCÊ</span><div class="bar"><div id="hp1" class="fill"></div></div>
<span>RIVAL</span><div class="bar"><div id="hp2" class="fill"></div></div>
</div>
<div id="weaponInfo">Procure uma arma pelo mapa</div>
<div id="roundInfo">RODADA 1/10</div>
<div id="roomlabel"></div>
</div>

<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div id="shoot" class="ctrl">ATIRAR</div>
<div id="jump" class="ctrl">PULAR</div>
<div id="special" class="ctrl">ESPECIAL</div>
<div id="drop" class="ctrl">SOLTAR</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
'use strict';

const $=id=>document.getElementById(id);
const {Engine,World,Bodies,Body}=Matter;
const engine=Engine.create();
engine.gravity.y=1.05;
const world=engine.world;

const canvas=$('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=1,camera=0;

function resize(){
D=Math.min(devicePixelRatio||1,2);
W=innerWidth;H=innerHeight;
canvas.width=W*D;canvas.height=H*D;
canvas.style.width=W+'px';canvas.style.height=H+'px';
ctx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);
resize();

const firebaseConfig={
apiKey:'AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw',
authDomain:'draw-battle-60d94.firebaseapp.com',
databaseURL:'https://draw-battle-60d94-default-rtdb.firebaseio.com',
projectId:'draw-battle-60d94',
storageBucket:'draw-battle-60d94.firebasestorage.app',
messagingSenderId:'533481028234',
appId:'1:533481028234:web:d2fb69123057bcdd3e4b73'
};

let db=null,uid=null,room=null,playerRef=null;
let online=false,enemyData=null,enemySeen=false,lastSync=0;

try{
if(window.firebase){
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
db=firebase.database();
firebase.auth().signInAnonymously().then(c=>{
uid=c.user.uid;
$('status').textContent='Firebase conectado!';
}).catch(e=>$('status').textContent='Firebase: '+e.message);
}
}catch(e){$('status').textContent='Firebase indisponível'}

const WORLD_WIDTH=5000,FLOOR=650;
let mapIndex=0;

const maps=[
{name:'CIDADE',color:'#403b3e',platforms:[
[180,500,300,20],[600,420,250,20],[1000,510,300,20],
[1400,400,280,20],[1850,500,300,20],[2300,420,300,20],
[2800,510,300,20],[3250,410,300,20],[3800,500,250,20],
[380,300,170,18],[1250,270,200,18],[2100,290,200,18],
[3100,280,180,18],[3500,300,220,18],[4050,390,180,18],
[4550,310,190,18]
]},
{name:'ARENA',color:'#393d49',platforms:[
[250,490,450,20],[900,390,300,20],[1400,490,400,20],
[2000,350,400,20],[2600,490,400,20],[3300,390,300,20],
[3900,490,450,20],[600,260,200,18],[1800,220,250,18],
[3000,250,250,18],[4200,260,250,18]
]},
{name:'FÁBRICA',color:'#34383b',platforms:[
[300,500,500,20],[1000,430,400,20],[1600,500,350,20],
[2200,400,400,20],[2900,500,350,20],[3500,420,400,20],
[4200,500,400,20],[600,280,250,18],[1800,260,250,18],
[3100,260,250,18],[4100,280,250,18]
]}
];

let platforms=[],platformBodies=[];

function buildMap(){
platformBodies.forEach(b=>World.remove(world,b));
platforms=[[0,FLOOR,WORLD_WIDTH,300],...maps[mapIndex].platforms];
platformBodies=platforms.map(p=>Bodies.rectangle(
p[0]+p[2]/2,p[1]+p[3]/2,p[2],p[3],
{isStatic:true,friction:.9}
));
World.add(world,platformBodies);
}
buildMap();

const guns=[
['Pistola',15,1100,.3,'#ffe08b',24],
['Revólver',27,1250,.55,'#ffca7b',12],
['Desert Eagle',38,1350,.7,'#ffdb78',8],
['Escopeta',9,950,.8,'#ff9c58',24,8],
['Escopeta dupla',11,1000,1,'#ff8a50',12,12],
['SMG',7,1250,.085,'#ffe68d',90],
['MP5',8,1300,.11,'#ffe68d',80],
['Vector',6,1350,.065,'#ffe68d',100],
['Rifle',12,1500,.18,'#f9d77d',60],
['AK-47',14,1450,.2,'#f9d77d',45],
['M4',11,1600,.13,'#f9d77d',60],
['Fuzil pesado',20,1350,.35,'#ffb26b',30],
['Sniper',70,2100,1.2,'#c9edff',5],
['Lança-chamas',5,650,.045,'#ff743a',100],
['Lançador',48,650,1.2,'#ff8c52',5,1],
['Granada',55,500,1.1,'#a6e881',3,1,1],
['Laser',32,2200,.5,'#50eaff',20],
['Plasma',26,1050,.35,'#c478ff',18],
['Canhão',85,1000,1.8,'#ff5b9c',3,1]
];

// Corpo físico único e estável; membros desenhados com animação.
function createFighter(x,y,color){
const body=Bodies.rectangle(x,y,24,66,{
density:.002,friction:.8,restitution:0,inertia:Infinity,label:'fighter'
});
World.add(world,body);
return{
body,color,hp:100,gun:-1,ammo:0,cool:0,face:1,walk:0,
get x(){return body.position.x},
get y(){return body.position.y}
};
}

function removeFighter(f){if(f)World.remove(world,f.body)}

function resetFighter(f,x,y,face){
Body.setPosition(f.body,{x,y});
Body.setVelocity(f.body,{x:0,y:0});
Body.setAngle(f.body,0);
f.hp=100;f.gun=-1;f.ammo=0;f.cool=0;f.face=face;f.walk=0;
}

function grounded(f){
const b=f.body.bounds;
return platformBodies.some(p=>{
const q=p.bounds;
return b.max.y>=q.min.y-3&&b.max.y<=q.min.y+13&&
b.max.x>q.min.x&&b.min.x<q.max.x&&f.body.velocity.y>=-1;
});
}

let player=null,enemy=null;
let bullets=[],pickups=[],particles=[],explosions=[],active=false;
let dropTimer=0;

function burst(x,y,color,n=12){
for(let i=0;i<n;i++){
const a=Math.random()*Math.PI*2,s=80+Math.random()*380;
particles.push({
x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
life:.3+Math.random()*.5,color
});
}
}

function damage(f,d){
if(!f||f.hp<=0)return;
f.hp=Math.max(0,f.hp-d);
Body.applyForce(f.body,f.body.position,{
x:(Math.random()-.5)*.012,y:-.006
});
}

function shoot(special=false){
if(!player||player.gun<0||player.ammo<=0||player.cool>0)return;
const g=guns[player.gun];
player.cool=g[3];player.ammo--;
const count=g[6]||1;
for(let i=0;i<count;i++){
const spread=count>1?(Math.random()-.5)*.45:0;
bullets.push({
x:player.x+player.face*18,y:player.y-8,
vx:Math.cos(spread)*g[1]*player.face,
vy:Math.sin(spread)*g[1],
damage:g[1]*(special?1.3:1),
color:g[4],life:1.8,owner:'player',
explosive:!!g[7]
});
}
burst(player.x+player.face*25,player.y-8,g[4],5);
}

function spawnWave(){
const ids=[];
while(ids.length<2){
const id=Math.floor(Math.random()*guns.length);
if(!ids.includes(id))ids.push(id);
}
for(const id of ids){
const x=Math.max(100,Math.min(WORLD_WIDTH-100,camera+Math.random()*W));
const body=Bodies.rectangle(x,45,38,14,{density:.002,restitution:.35});
World.add(world,body);
pickups.push({body,gun:id,ammo:guns[id][5]});
}
}

function removePickup(p){
World.remove(world,p.body);
pickups=pickups.filter(v=>v!==p);
}

const input={move:0,jump:false,fire:false,special:false,drop:false};
let jumpPrev=false;

function bind(id,key){
const el=$(id);
el.addEventListener('pointerdown',e=>{
e.preventDefault();input[key]=true;el.setPointerCapture(e.pointerId);
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
el.addEventListener(ev,()=>input[key]=false)
);
}
bind('jump','jump');bind('shoot','fire');
bind('special','special');bind('drop','drop');

const stick=$('stick'),knob=$('knob');
let joy=null;

function joyMove(e){
const r=stick.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
let l=Math.hypot(x,y),m=43;
if(l>m){x=x/l*m;y=y/l*m}
input.move=x/m;
knob.style.left=`calc(50% + ${x}px)`;
knob.style.top=`calc(50% + ${y}px)`;
}

stick.onpointerdown=e=>{joy=e.pointerId;stick.setPointerCapture(joy);joyMove(e)};
stick.onpointermove=e=>{if(e.pointerId===joy)joyMove(e)};

function joyEnd(){
joy=null;input.move=0;knob.style.left='50%';knob.style.top='50%';
}
stick.onpointerup=joyEnd;stick.onpointercancel=joyEnd;

addEventListener('keydown',e=>{
if(['a','ArrowLeft'].includes(e.key))input.move=-1;
if(['d','ArrowRight'].includes(e.key))input.move=1;
if([' ','ArrowUp','w'].includes(e.key))input.jump=true;
if(e.key==='j')input.fire=true;
if(e.key==='k')input.special=true;
if(e.key==='q')input.drop=true;
});

addEventListener('keyup',e=>{
if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))input.move=0;
if([' ','ArrowUp','w'].includes(e.key))input.jump=false;
if(e.key==='j')input.fire=false;
if(e.key==='k')input.special=false;
if(e.key==='q')input.drop=false;
});

const MAX_ROUNDS=10;
let round=1,playerWins=0,enemyWins=0,roundFinished=false,roundTimer=0;

function updateScore(){
$('roundInfo').textContent=`RODADA ${round}/${MAX_ROUNDS} • VOCÊ ${playerWins} × ${enemyWins} RIVAL`;
}

function finishRound(w){
if(roundFinished||!active)return;
roundFinished=true;
if(w==='player')playerWins++;else enemyWins++;
updateScore();
$('weaponInfo').textContent=w==='player'?'VOCÊ VENCEU A RODADA!':'VOCÊ PERDEU A RODADA!';
roundTimer=2.5;
}

function nextRound(){
if(round>=MAX_ROUNDS){
$('weaponInfo').textContent=playerWins>enemyWins?'🏆 VOCÊ VENCEU!':enemyWins>playerWins?'🏆 O RIVAL VENCEU!':'EMPATE!';
$('roundInfo').textContent=`FIM DE JOGO • ${playerWins} × ${enemyWins}`;
roundFinished=true;return;
}
round++;
bullets=[];
pickups.slice().forEach(removePickup);
resetFighter(player,500,560,1);
if(enemy)resetFighter(enemy,1100,560,-1);
roundFinished=false;updateScore();
}

async function joinRoom(code,host){
try{
room=db.ref('rooms/'+code);
const snap=await room.once('value');
if(host&&snap.exists()){
code=String(Math.floor(100000+Math.random()*900000));
room=db.ref('rooms/'+code);
}
if(!host&&!snap.exists()){$('status').textContent='Sala não encontrada';return}
if(host)await room.set({players:{}});
const existing=(await room.child('players').once('value')).val()||{};
if(Object.keys(existing).length>=2&&!existing[uid]){
$('status').textContent='Sala cheia';return;
}
if(player)removeFighter(player);
player=createFighter(host?500:WORLD_WIDTH-500,560,'#f2f0e8');
player.face=host?1:-1;
playerRef=room.child('players/'+uid);
await playerRef.set({x:player.x,y:player.y,hp:100,face:player.face,gun:-1,ammo:0});
playerRef.onDisconnect().remove();
room.child('players').on('value',s=>{
const all=s.val()||{};
const other=Object.entries(all).find(([id])=>id!==uid);
enemySeen=!!other;enemyData=other?other[1]:null;
if(other&&!enemy){
enemy=createFighter(other[1].x||1000,560,'#59e5e1');
enemy.remote=true;
}
});
online=true;
$('roomlabel').textContent='Sala '+code;
startGame();
}catch(e){$('status').textContent='Erro: '+e.message}
}

function startGame(){
active=true;
$('menu').style.display='none';
$('hud').style.display='block';
$('controls').style.display='block';
updateScore();
}

$('solo').onclick=()=>{
online=false;enemySeen=true;enemyData=null;
if(player)removeFighter(player);
if(enemy)removeFighter(enemy);
round=1;playerWins=enemyWins=0;roundFinished=false;
bullets=[];pickups.slice().forEach(removePickup);
mapIndex=Math.floor(Math.random()*maps.length);
buildMap();
player=createFighter(500,560,'#f2f0e8');
enemy=createFighter(1100,560,'#59e5e1');
enemy.gun=0;enemy.ammo=24;
startGame();
};

$('create').onclick=()=>{
if(!db||!uid){$('status').textContent='Aguarde o Firebase conectar';return}
joinRoom(String(Math.floor(100000+Math.random()*900000)),true);
};

$('join').onclick=()=>{
const c=$('roomcode').value.trim();
if(!/^\d{6}$/.test(c)){$('status').textContent='Digite seis números';return}
if(!db||!uid){$('status').textContent='Aguarde o Firebase conectar';return}
joinRoom(c,false);
};

function update(dt){
if(!active||!player)return;
Engine.update(engine,dt*1000);

if(roundFinished){
roundTimer-=dt;
if(roundTimer<=0)nextRound();
return;
}

const p=player.body,v=p.velocity,target=input.move*5.2;
Body.setVelocity(p,{
x:v.x+(target-v.x)*Math.min(1,dt*13),y:v.y
});

if(Math.abs(input.move)>.1)player.face=Math.sign(input.move);

if(input.jump&&!jumpPrev&&grounded(player)){
Body.setVelocity(p,{x:p.velocity.x,y:-10.5});
}
jumpPrev=input.jump;
player.walk+=Math.abs(p.velocity.x)*dt*.13;

if(input.fire)shoot(false);
if(input.special)shoot(true);
player.cool=Math.max(0,player.cool-dt);

if(input.drop&&player.gun>=0){
player.gun=-1;player.ammo=0;input.drop=false;
}

if(online&&enemyData&&enemy){
const tx=enemyData.x,ty=enemyData.y;
Body.setPosition(enemy.body,{
x:enemy.x+(tx-enemy.x)*.35,
y:enemy.y+(ty-enemy.y)*.35
});
enemy.hp=enemyData.hp??100;
enemy.face=enemyData.face||-1;
enemy.gun=enemyData.gun??-1;
}else if(!online&&enemy){
const dx=player.x-enemy.x;
Body.setVelocity(enemy.body,{
x:Math.abs(dx)>90?Math.sign(dx)*2.5:0,
y:enemy.body.velocity.y
});
enemy.face=Math.sign(dx)||-1;
if(enemy.gun>=0&&Math.random()<.012){
bullets.push({
x:enemy.x+enemy.face*20,y:enemy.y-8,
vx:enemy.face*950,vy:0,damage:8,
color:'#59e5e1',life:1,owner:'enemy'
});
}
}

for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=100*dt;b.life-=dt;
const target=b.owner==='enemy'?player:(enemySeen?enemy:null);
if(target&&Math.abs(b.x-target.x)<19&&Math.abs(b.y-(target.y-5))<35){
damage(target,b.damage);burst(b.x,b.y,b.color,8);
bullets.splice(i,1);continue;
}
if(b.life<=0||b.x<0||b.x>WORLD_WIDTH||b.y>1000)bullets.splice(i,1);
}

for(const p of [...pickups]){
if(Math.hypot(p.body.position.x-player.x,p.body.position.y-player.y)<48){
player.gun=p.gun;player.ammo=p.ammo;
burst(player.x,player.y,guns[p.gun][4],12);removePickup(p);
}else if(!online&&enemy&&Math.hypot(p.body.position.x-enemy.x,p.body.position.y-enemy.y)<45){
enemy.gun=p.gun;enemy.ammo=p.ammo;removePickup(p);
}
}

for(const p of particles){
p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;
}
particles=particles.filter(p=>p.life>0);

if(player.hp<=0||player.y>1100){finishRound('enemy');return}
if(enemy&&(enemy.hp<=0||enemy.y>1100)){finishRound('player');return}

dropTimer+=dt;
if(dropTimer>=60){dropTimer=0;spawnWave()}

camera=Math.max(0,Math.min(WORLD_WIDTH-W,player.x-W*.42));
$('hp1').style.width=player.hp+'%';
$('hp2').style.width=(enemy?enemy.hp:100)+'%';
$('weaponInfo').textContent=player.gun<0?'Sem arma — procure uma no mapa':guns[player.gun][0]+' | Munição: '+player.ammo;

if(online&&playerRef&&performance.now()-lastSync>120){
lastSync=performance.now();
playerRef.update({
x:player.x,y:player.y,hp:player.hp,face:player.face,
gun:player.gun,ammo:player.ammo,updated:Date.now()
}).catch(()=>{});
}
}

function background(){
const g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#f4a84f');g.addColorStop(.65,'#a85d3e');g.addColorStop(1,'#342c35');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(W*.75,H*.23,65,0,7);ctx.fill();
ctx.save();ctx.translate(-camera*.25,0);
for(let x=0;x<6000;x+=270){
const h=130+(x%5)*25;
ctx.fillStyle='#493b43';ctx.fillRect(x,H*.72-h,230,h);
for(let wx=15;wx<210;wx+=45)for(let wy=20;wy<h-15;wy+=40){
ctx.fillStyle='#e6a65b';ctx.fillRect(x+wx,H*.72-h+wy,22,25);
}
}
ctx.restore();
}

function drawGun(x,y,id){
const g=guns[id];
ctx.fillStyle='#252a32';ctx.fillRect(x,y-5,id===12?52:36,10);
ctx.fillStyle=g[4];ctx.fillRect(x+8,y-2,18,3);
ctx.fillStyle='#795039';ctx.fillRect(x+8,y+4,8,11);
}

function drawMap(){
ctx.save();ctx.translate(-camera,0);
ctx.fillStyle=maps[mapIndex].color;ctx.fillRect(0,FLOOR,WORLD_WIDTH,300);
ctx.fillStyle='#a17a59';ctx.fillRect(0,FLOOR,WORLD_WIDTH,7);
for(const p of platforms.slice(1)){
ctx.fillStyle='#493b3d';ctx.fillRect(...p);
ctx.fillStyle='#d09a62';ctx.fillRect(p[0],p[1],p[2],5);
}
for(let x=0;x<WORLD_WIDTH;x+=650){
ctx.fillStyle='#593e3b';ctx.fillRect(x,FLOOR-230,230,230);
for(let wx=20;wx<210;wx+=55)for(let wy=25;wy<210;wy+=55){
ctx.fillStyle='#ad673d';ctx.fillRect(x+wx,FLOOR-230+wy,35,40);
}
}
for(const p of pickups){
const q=p.body.position;
ctx.save();ctx.translate(q.x,q.y);ctx.rotate(p.body.angle);
drawGun(0,0,p.gun);ctx.restore();
ctx.fillStyle='#ffe48c';ctx.font='11px Arial';ctx.textAlign='center';
ctx.fillText(guns[p.gun][0],q.x,q.y-15);
}
ctx.restore();
}

function drawFighter(f){
if(!f)return;
ctx.save();ctx.translate(-camera+f.x,f.y);
const moving=Math.abs(f.body.velocity.x)>.5,phase=f.walk;
const leg=Math.sin(phase)*(moving?13:2);
const arm=Math.sin(phase+Math.PI)*(moving?10:2);
ctx.scale(f.face,1);ctx.lineCap='round';
ctx.strokeStyle=f.color;ctx.lineWidth=7;ctx.beginPath();
ctx.moveTo(0,-8);ctx.lineTo(-leg,-22);ctx.lineTo(-leg*1.2,0);
ctx.moveTo(0,-8);ctx.lineTo(leg,-22);ctx.lineTo(leg*1.2,0);
ctx.moveTo(0,-42);ctx.lineTo(-12+arm,-24);ctx.lineTo(-18+arm,-10);
ctx.moveTo(0,-42);ctx.lineTo(12-arm,-24);ctx.lineTo(20-arm,-12);
ctx.stroke();
ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,-49);ctx.lineTo(0,-15);ctx.stroke();
ctx.fillStyle='#f2f0e8';ctx.beginPath();ctx.arc(0,-62,12,0,7);ctx.fill();
ctx.strokeStyle='#252a32';ctx.lineWidth=2;ctx.stroke();
if(f.gun>=0)drawGun(17,-14,f.gun);
ctx.restore();
}

function render(){
background();drawMap();drawFighter(player);
if(enemySeen||!online)drawFighter(enemy);
ctx.save();ctx.translate(-camera,0);
for(const b of bullets){
ctx.strokeStyle=b.color;ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(b.x-b.vx*.02,b.y-b.vy*.02);
ctx.lineTo(b.x,b.y);ctx.stroke();
}
for(const p of particles){
ctx.globalAlpha=Math.max(0,p.life*2);
ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);
}
ctx.restore();ctx.globalAlpha=1;
}

let last=performance.now();
function loop(now){
const dt=Math.min(.033,(now-last)/1000||0);
last=now;update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

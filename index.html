
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Battle</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#160b19;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
#game{
 width:100vw;height:100vh;display:block;
 background:#30101d;
}
#menu{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:linear-gradient(#170b20dd,#210b18ee);
 z-index:5;
}
.panel{
 width:min(390px,90vw);padding:25px;
 background:#241324;border:1px solid #8b432e;
 border-radius:16px;text-align:center;
 box-shadow:0 0 35px #ff541e33;
}
h1{color:#ff9b35;font-size:32px;margin:0 0 8px}
.subtitle{color:#c5a5a0;font-size:13px;margin-bottom:22px}
input{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #70402f;border-radius:8px;
 background:#140d19;color:white;font-size:17px;
 text-align:center;text-transform:uppercase;
}
button{
 border:0;border-radius:8px;padding:13px;
 font-weight:bold;cursor:pointer;
}
.mainbtn{width:100%;margin:6px 0;background:#ff8733;color:#24101a}
.secondary{width:100%;margin:6px 0;background:#493044;color:white}
#status{font-size:12px;color:#ffbf77;min-height:18px;margin-top:10px}
#hud{
 position:absolute;top:12px;left:50%;
 transform:translateX(-50%);width:min(600px,94vw);
 display:none;justify-content:space-between;align-items:center;
 pointer-events:none;
}
.playerhud{width:43%;text-align:center}
.bar{height:13px;background:#28131c;border:1px solid #e8a05b;border-radius:20px;overflow:hidden}
.health{height:100%;background:#ff8a32;width:100%;transition:width .15s}
.name{font-size:12px;margin-bottom:4px;text-shadow:0 2px 4px black}
#roomLabel{position:absolute;top:65px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffd09c;display:none}
#controls{
 position:absolute;bottom:18px;left:0;width:100%;
 display:none;justify-content:space-between;padding:0 18px;
 pointer-events:none;
}
.group{display:flex;gap:10px;pointer-events:auto}
.ctrl{
 width:58px;height:58px;border-radius:50%;
 background:#401e2dbb;color:white;border:1px solid #ffad68;
 font-size:22px;touch-action:none;user-select:none;
}
.ctrl.attack{background:#a33d27cc;width:68px;height:68px}
#message{
 position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);
 font-size:27px;font-weight:bold;color:#ffb15e;
 text-shadow:0 3px 10px black;display:none;text-align:center;
 pointer-events:none;
}
#exit{
 display:none;position:absolute;right:12px;top:12px;
 background:#321b2b;color:white;padding:9px 13px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
 <div class="panel">
  <h1>STICKMAN BATTLE</h1>
  <div class="subtitle">LUTE. SOBREVIVA. VENÇA.</div>
  <button class="mainbtn" onclick="createRoom()">CRIAR PARTIDA</button>
  <input id="roomInput" maxlength="6" placeholder="CÓDIGO DA SALA">
  <button class="secondary" onclick="joinRoom()">ENTRAR NA PARTIDA</button>
  <div id="status">Conectando ao servidor...</div>
 </div>
</div>

<div id="hud">
 <div class="playerhud">
  <div class="name">JOGADOR 1</div>
  <div class="bar"><div id="hp1" class="health"></div></div>
 </div>
 <div class="playerhud">
  <div class="name">JOGADOR 2</div>
  <div class="bar"><div id="hp2" class="health"></div></div>
 </div>
</div>

<div id="roomLabel"></div>
<div id="message"></div>
<button id="exit" onclick="leaveGame()">SAIR</button>

<div id="controls">
 <div class="group">
  <button class="ctrl" data-key="left">◀</button>
  <button class="ctrl" data-key="right">▶</button>
  <button class="ctrl" data-key="jump">⬆</button>
 </div>
 <div class="group">
  <button class="ctrl attack" data-key="attack">⚔</button>
 </div>
</div>

<script>
// CONFIGURAÇÃO FIREBASE
const firebaseConfig = {
 apiKey: "AIzaSyCiIQA4PLfEX6WwrEFqpEGR_rKKBisk8Cw",
 authDomain: "draw-battle-60d94.firebaseapp.com",
 databaseURL: "https://draw-battle-60d94-default-rtdb.firebaseio.com",
 projectId: "draw-battle-60d94",
 storageBucket: "draw-battle-60d94.firebasestorage.app",
 messagingSenderId: "533481028234",
 appId: "1:533481028234:web:d2fb69123057bcdd3e4b73",
 measurementId: "G-4ZZY2234EY"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let playerId=null,roomId=null,roomRef=null;
let online=false,gameStarted=false,opponent=null;
let lastSync=0,lastAttack=0;
let cameraX=0,frame=0;
let myHealth=100,enemyHealth=100;
let gameOver=false;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const keys={left:false,right:false,jump:false,attack:false};

const platforms=[
 {x:0,y:650,w:4000,h:60},
 {x:120,y:530,w:300,h:18},
 {x:650,y:470,w:210,h:18},
 {x:1050,y:540,w:300,h:18},
 {x:1550,y:450,w:220,h:18},
 {x:2200,y:530,w:320,h:18},
 {x:2750,y:470,w:230,h:18},
 {x:3300,y:540,w:300,h:18}
];

const tower={x:1900,y:320,w:170,h:330};

let player={
 x:600,y:300,vx:0,vy:0,
 facing:1,ground:false,
 hp:100,attack:false,walk:0
};

function say(text){
 document.getElementById("status").textContent=text;
}

async function login(){
 try{
  const result=await auth.signInAnonymously();
  playerId=result.user.uid;
  say("Conectado! Crie ou entre em uma sala.");
 }catch(e){
  say("Erro de conexão: "+e.message);
 }
}
login();

function randomCode(){
 return Math.random().toString(36).substring(2,8).toUpperCase();
}

async function createRoom(){
 if(!playerId){say("Aguarde a conexão...");return}
 const code=randomCode();
 roomRef=db.ref("rooms/"+code);

 try{
  await roomRef.set({
   type:"stickfight",
   status:"waiting",
   createdAt:Date.now(),
   players:{
    [playerId]:{
     x:600,y:300,hp:100,ready:true
    }
   }
  });
  roomId=code;
  online=true;
  startGame(1);
  listenRoom();
 }catch(e){say("Não foi possível criar a sala: "+e.message)}
}

async function joinRoom(){
 if(!playerId){say("Aguarde a conexão...");return}
 const code=document.getElementById("roomInput").value.trim().toUpperCase();
 if(code.length!==6){say("Digite um código válido.");return}

 const ref=db.ref("rooms/"+code);
 try{
  const snap=await ref.get();
  if(!snap.exists()){say("Sala não encontrada.");return}
  const data=snap.val();
  const players=data.players||{};
  if(Object.keys(players).length>=2){say("Essa sala já está cheia.");return}
  if(data.type!=="stickfight"){say("Sala incompatível.");return}

  roomId=code;
  roomRef=ref;
  await ref.child("players/"+playerId).set({
   x:2400,y:300,hp:100,ready:true
  });
  await ref.child("status").set("playing");
  online=true;
  startGame(2);
  listenRoom();
 }catch(e){say("Erro ao entrar: "+e.message)}
}

function startGame(slot){
 gameStarted=true;
 gameOver=false;
 myHealth=100;enemyHealth=100;
 player={
  x:slot===1?600:2400,y:300,vx:0,vy:0,
  facing:slot===1?1:-1,ground:false,
  hp:100,attack:false,walk:0
 };
 opponent=null;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("controls").style.display="flex";
 document.getElementById("exit").style.display="block";
 document.getElementById("roomLabel").style.display="block";
 document.getElementById("roomLabel").textContent="SALA: "+roomId;
}

function listenRoom(){
 roomRef.child("players").on("value",snap=>{
  const players=snap.val()||{};
  const other=Object.entries(players).find(([id])=>id!==playerId);
  if(other){
   opponent={id:other[0],...other[1]};
   enemyHealth=opponent.hp??100;
  }else opponent=null;
  updateHud();
 });
}

function updateHud(){
 document.getElementById("hp1").style.width=
  Math.max(0,Math.min(100,myHealth))+"%";
 document.getElementById("hp2").style.width=
  Math.max(0,Math.min(100,enemyHealth))+"%";
}

function leaveGame(){
 if(roomRef&&playerId){
  roomRef.child("players/"+playerId).remove().catch(()=>{});
  roomRef.off();
 }
 gameStarted=false;online=false;roomId=null;
 document.getElementById("menu").style.display="flex";
 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";
 document.getElementById("exit").style.display="none";
 document.getElementById("roomLabel").style.display="none";
 document.getElementById("message").style.display="none";
 say("Você saiu da partida.");
}

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=true;
 if(e.key==="d"||e.key==="ArrowRight")keys.right=true;
 if(e.key==="w"||e.key==="ArrowUp"||e.key===" ")keys.jump=true;
 if(e.key==="j"||e.key==="k")keys.attack=true;
});
addEventListener("keyup",e=>{
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=false;
 if(e.key==="d"||e.key==="ArrowRight")keys.right=false;
 if(e.key==="w"||e.key==="ArrowUp"||e.key===" ")keys.jump=false;
 if(e.key==="j"||e.key==="k")keys.attack=false;
});

document.querySelectorAll(".ctrl").forEach(btn=>{
 const key=btn.dataset.key;
 const down=e=>{e.preventDefault();keys[key]=true};
 const up=e=>{e.preventDefault();keys[key]=false};
 btn.addEventListener("pointerdown",down);
 btn.addEventListener("pointerup",up);
 btn.addEventListener("pointerleave",up);
 btn.addEventListener("pointercancel",up);
});

function update(){
 if(!gameStarted||gameOver)return;
 frame++;

 const speed=.75;
 if(keys.left){player.vx-=speed;player.facing=-1}
 if(keys.right){player.vx+=speed;player.facing=1}
 player.vx*=.84;
 player.vx=Math.max(-7,Math.min(7,player.vx));

 if(keys.jump&&player.ground){
  player.vy=-13;
  player.ground=false;
 }
 player.vy+=.55;
 player.vy=Math.min(player.vy,15);

 player.x+=player.vx;
 player.y+=player.vy;

 player.ground=false;
 for(const p of platforms){
  if(player.x+14>p.x&&player.x-14<p.x+p.w&&
    player.y+40>=p.y&&player.y+40<=p.y+22&&player.vy>=0){
   player.y=p.y-40;
   player.vy=0;
   player.ground=true;
  }
 }

 // Torre central: colisão lateral e topo
 if(player.x+14>tower.x&&player.x-14<tower.x+tower.w&&
    player.y+40>tower.y&&player.y<tower.y+tower.h){
  if(player.x<tower.x+tower.w/2)player.x=tower.x-15;
  else player.x=tower.x+tower.w+15;
  player.vx=0;
 }

 player.x=Math.max(20,Math.min(3980,player.x));
 player.walk+=Math.abs(player.vx)*.08;

 if(keys.attack&&Date.now()-lastAttack>600){
  lastAttack=Date.now();
  player.attack=true;
  setTimeout(()=>player.attack=false,220);
  tryHit();
 }

 if(online&&roomRef&&Date.now()-lastSync>70){
  lastSync=Date.now();
  roomRef.child("players/"+playerId).update({
   x:player.x,y:player.y,hp:myHealth,
   facing:player.facing,attack:player.attack,
   updatedAt:Date.now()
  }).catch(()=>{});
 }
 if(player.y>850){
  player.y=200;player.vy=0;
  myHealth-=10;updateHud();
  checkEnd();
 }
 cameraX=Math.max(0,Math.min(4000-W,player.x-W*.5));
}

function tryHit(){
 if(!opponent||!online||!roomRef)return;
 const dx=opponent.x-player.x;
 const dy=Math.abs((opponent.y||0)-player.y);
 if(Math.abs(dx)<95&&dy<85&&dx*player.facing>0){
  const damage=12;
  roomRef.child("players/"+opponent.id+"/hp").transaction(hp=>{
   return Math.max(0,(hp??100)-damage);
  });
  roomRef.child("players/"+opponent.id).update({
   knockback:player.facing*9,
   hitAt:Date.now()
  });
 }
}

function checkEnd(){
 if(myHealth<=0){
  gameOver=true;showMessage("VOCÊ PERDEU!");
 }
 if(enemyHealth<=0){
  gameOver=true;showMessage("VOCÊ VENCEU!");
 }
}

function showMessage(t){
 const el=document.getElementById("message");
 el.textContent=t+"<br><small>Saia da sala para jogar novamente</small>";
 el.style.display="block";
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#3a102b");
 g.addColorStop(.48,"#812d28");
 g.addColorStop(1,"#d34b20");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // Montanhas ao fundo
 ctx.fillStyle="#511b2b";
 ctx.beginPath();
 ctx.moveTo(0,H*.45);
 for(let x=0;x<=W+100;x+=100){
  ctx.lineTo(x,H*.25+Math.sin((x+cameraX*.12)*.006)*35);
 }
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 // Luz do cenário
 const glow=ctx.createRadialGradient(W/2,H*.6,10,W/2,H*.6,W*.6);
 glow.addColorStop(0,"#ff702a55");
 glow.addColorStop(1,"#ff702a00");
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}

function drawArena(){
 ctx.save();
 ctx.translate(-cameraX,0);

 // Torre central
 ctx.fillStyle="#571e29";
 ctx.fillRect(tower.x,tower.y,tower.w,tower.h);
 ctx.fillStyle="#ff7c22";
 ctx.fillRect(tower.x-8,tower.y+20,9,100);
 ctx.fillRect(tower.x+tower.w,tower.y+20,9,100);
 ctx.fillStyle="#26152a";
 ctx.fillRect(tower.x,tower.y,tower.w,24);
 for(let y=tower.y+38;y<tower.y+tower.h;y+=42){
  ctx.strokeStyle="#211326";ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(tower.x+10,y+20);
  ctx.lineTo(tower.x+tower.w-10,y-15);
  ctx.stroke();
 }

 // Plataformas
 for(const p of platforms){
  ctx.fillStyle="#3b1b29";
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#9c432c";
  ctx.fillRect(p.x,p.y,p.w,4);
  ctx.fillStyle="#201323";
  ctx.fillRect(p.x,p.y+p.h,p.w,7);
 }

 // Partículas luminosas
 for(let i=0;i<40;i++){
  const x=(i*173+frame*.3)%4000;
  const y=180+(i*71)%440;
  ctx.fillStyle=i%2?"#ffb35a66":"#ffdf9a55";
  ctx.fillRect(x,y,2,2);
 }
 ctx.restore();
}

function drawStickman(x,y,color,facing,walking,attacking,isOpponent){
 ctx.save();
 ctx.translate(x-cameraX,y);
 ctx.scale(facing||1,1);

 const swing=Math.sin(walking)*.55;
 const headY=-25;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.strokeStyle=color;
 ctx.fillStyle=color;
 ctx.lineWidth=5;

 // Cabeça
 ctx.beginPath();ctx.arc(0,headY,8,0,Math.PI*2);ctx.fill();

 // Corpo
 ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,12);ctx.stroke();

 // Braços
 ctx.beginPath();
 ctx.moveTo(0,-10);
 if(attacking){
  ctx.lineTo(23,-9);ctx.lineTo(39,-15);
 }else{
  ctx.lineTo(-12+swing*8,1);
 }
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,-10);
 ctx.lineTo(12-swing*8,3);
 ctx.stroke();

 // Pernas
 ctx.beginPath();
 ctx.moveTo(0,12);
 ctx.lineTo(-10+Math.sin(walking)*9,29);
 ctx.lineTo(-13+Math.sin(walking)*12,39);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,12);
 ctx.lineTo(10-Math.sin(walking)*9,29);
 ctx.lineTo(13-Math.sin(walking)*12,39);
 ctx.stroke();

 // Arma
 if(attacking){
  ctx.strokeStyle="#ffd18a";
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(25,-10);ctx.lineTo(53,-22);ctx.stroke();
  ctx.fillStyle="#fff0b0";
  ctx.beginPath();ctx.arc(53,-22,4,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}

function draw(){
 background();
 drawArena();

 if(gameStarted){
  drawStickman(player.x,player.y,"#ffd12e",
   player.facing,player.walk,player.attack,false);

  if(opponent){
   const enemyFacing=opponent.facing||-player.facing;
   drawStickman(opponent.x,opponent.y,"#67d9ee",
    enemyFacing,frame*.12,opponent.attack,false);
  }
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();

// Recebe dano e empurrão do adversário
setInterval(()=>{
 if(!opponent||!roomRef||!gameStarted||gameOver)return;
 if(opponent.hitAt&&opponent.hitAt!==window.lastHit){
  window.lastHit=opponent.hitAt;
  if(Date.now()-opponent.hitAt<1200){
   myHealth=Math.max(0,myHealth-12);
   player.vx+=(opponent.knockback||-5);
   player.vy=-4;
   updateHud();
   checkEnd();
  }
 }
},100);
</script>
</body>
</html>
